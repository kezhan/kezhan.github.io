<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Un ou une ? · L'Île aux mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ---- Un ou une ? / A or an? / 选量词 / Der, die oder das? / Den, déi oder dat? ---- */
    /* Une couleur par genre (allemand, luxembourgeois) : bleu = der / den, rouge = die / déi, vert = das / dat. */
    :root {
      --genre-m: #1f5fbf;
      --genre-f: #c2362c;
      --genre-n: #1b7f45;
      --genre-m-bg: rgba(31, 95, 191, 0.09);
      --genre-f-bg: rgba(194, 54, 44, 0.08);
      --genre-n-bg: rgba(27, 127, 69, 0.09);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --genre-m: #8cb8ff;
        --genre-f: #ff9d93;
        --genre-n: #7bdca4;
        --genre-m-bg: rgba(140, 184, 255, 0.12);
        --genre-f-bg: rgba(255, 157, 147, 0.12);
        --genre-n-bg: rgba(123, 220, 164, 0.12);
      }
    }
    :root[data-theme='dark'] {
      --genre-m: #8cb8ff;
      --genre-f: #ff9d93;
      --genre-n: #7bdca4;
      --genre-m-bg: rgba(140, 184, 255, 0.12);
      --genre-f-bg: rgba(255, 157, 147, 0.12);
      --genre-n-bg: rgba(123, 220, 164, 0.12);
    }

    .genre .consigne { margin-bottom: 4px; }
    .genre-aide { margin: 0 0 6px; font-size: 0.95rem; color: var(--ink-soft); }

    /* Image (cachée au niveau 2 jusqu'à la réponse) : taille fixe pour éviter les sauts. */
    .genre-image {
      display: grid;
      place-items: center;
      width: 1.3em;
      height: 1.15em;
      margin: 4px auto 6px;
      line-height: 1;
      /* Emojis en couleur même si une police monochrome les connaît. */
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif;
    }
    .genre-image.is-cachee {
      border: 4px dashed var(--card-border);
      border-radius: 24px;
      background: var(--sand);
    }
    .genre-image__mystere {
      font-family: var(--font);
      font-size: 0.5em;
      font-weight: 700;
      color: var(--ink-soft);
    }

    /* Groupe nominal : [article] + mot, avec le bouton écouter. */
    .genre-ligne {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 6px 0 4px;
    }
    .genre-phrase {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3em;
      margin: 0;
      min-width: 0;
    }
    .genre-article {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.1em;
      height: 1.3em;
      padding: 0 0.15em;
      border: 3px dashed var(--sea-2);
      border-radius: 12px;
      background: rgba(47, 163, 214, 0.1);
      color: var(--sea-2);
      font-size: 0.9em;
      transition: background 0.2s, border-color 0.2s;
    }
    .genre-phrase.is-complete .genre-article {
      min-width: 0;
      height: auto;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--good);
      font-size: 1em;
    }
    .genre-phrase.is-elision { gap: 0; }
    /* Mots longs (Schmetterling, Waassermeloun, caterpillar…) : un peu plus petits pour garder
       l'article, le mot et le bouton écouter sur la même ligne. */
    .genre-phrase--long { font-size: clamp(1.45rem, 6.2vw, 2.8rem); letter-spacing: 0.02em; }
    .genre-phrase--xlong { font-size: clamp(1.3rem, 5.6vw, 2.6rem); letter-spacing: 0.01em; }
    .genre-mot { min-width: 0; overflow-wrap: anywhere; }

    /* Couleur du genre sur la réponse (allemand, luxembourgeois). */
    .genre-phrase[data-genre] .genre-mot {
      text-decoration: underline;
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.18em;
    }
    .genre-phrase.is-complete[data-genre='m'] .genre-article { color: var(--genre-m); }
    .genre-phrase.is-complete[data-genre='f'] .genre-article { color: var(--genre-f); }
    .genre-phrase.is-complete[data-genre='n'] .genre-article { color: var(--genre-n); }
    .genre-phrase[data-genre='m'] .genre-mot { text-decoration-color: var(--genre-m); }
    .genre-phrase[data-genre='f'] .genre-mot { text-decoration-color: var(--genre-f); }
    .genre-phrase[data-genre='n'] .genre-mot { text-decoration-color: var(--genre-n); }

    /* Chinois : caractères + pinyin dessous, « 一 » fixe devant le trou du classificateur. */
    .genre-phrase--hanzi { gap: 0.14em; align-items: flex-start; letter-spacing: 0.04em; }
    .genre-seg {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      min-width: 1em;
    }
    .genre-phrase--hanzi .genre-article { min-width: 1.45em; height: 1.35em; font-size: 0.9em; }
    /* Après la réponse, le classificateur a la hauteur de ligne des caractères voisins :
       son pinyin s'aligne sur celui de « 一 » et du nom. */
    .genre-phrase--hanzi.is-complete .genre-article { font-size: 1em; height: auto; border-width: 0; }
    .pinyin {
      display: block;
      font-size: 0.42em;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.01em;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .genre-phrase--hanzi.is-complete .pinyin { color: var(--good); }

    /* Gros boutons de réponse. */
    .choices.genre-choices {
      grid-template-columns: repeat(var(--nb, 2), minmax(0, 1fr));
      max-width: 460px;
      margin: 14px auto 0;
      gap: 14px;
    }
    .choices.genre-choices--3 { max-width: 560px; }
    .choices.genre-choices--4 { max-width: 600px; }
    .genre-choice {
      min-height: 88px;
      font-size: clamp(1.9rem, 8vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .genre--hanzi .genre-choice {
      flex-direction: column;
      gap: 0;
      line-height: 1.15;
      padding-left: 4px;
      padding-right: 4px;
    }
    .genre--hanzi .genre-choice .pinyin { font-size: 0.45em; }
    /* Couleurs par genre sur les boutons. */
    .genre-choice[data-genre='m'] { color: var(--genre-m); border-color: var(--genre-m); background: var(--genre-m-bg); }
    .genre-choice[data-genre='f'] { color: var(--genre-f); border-color: var(--genre-f); background: var(--genre-f-bg); }
    .genre-choice[data-genre='n'] { color: var(--genre-n); border-color: var(--genre-n); background: var(--genre-n-bg); }
    .genre-choice.is-correct[data-genre] { box-shadow: 0 0 0 4px var(--good), 0 4px 0 rgba(35, 50, 74, 0.15); }
    .genre-choice.is-grise,
    .genre-choice.is-grise:disabled,
    .genre-choice.is-grise[data-genre] {
      opacity: 0.6;
      background: rgba(128, 128, 128, 0.18);
      border-color: rgba(128, 128, 128, 0.45);
      color: var(--ink-soft);
      text-decoration: line-through;
      box-shadow: none;
    }
    .genre-choice.is-correct:disabled { opacity: 1; cursor: default; }
    .genre-choices.is-fini .genre-choice:not(.is-correct):not(.is-grise) { opacity: 0.45; }
    .genre-choices.is-fini .genre-choice { cursor: default; }

    @media (max-width: 480px) {
      .choices.genre-choices { gap: 10px; }
      .genre-choice { min-height: 76px; padding: 8px 4px; }
      .genre--hanzi .genre-choice { font-size: 1.9rem; }
      .genre-aide { font-size: 0.9rem; }
    }
    @media (max-width: 359px) {
      .genre-phrase { font-size: 1.5rem; }
      .genre-phrase--long { font-size: 1.25rem; }
      .genre-phrase--xlong { font-size: 1.05rem; }
      .genre-ligne { gap: 6px; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main id="jeu"></main>
  <script src="../data/lang/en.js"></script>
  <script src="../data/lang/zh.js"></script>
  <script src="../data/lang/de.js"></script>
  <script src="../data/lang/lb.js"></script>
  <script src="../data/lang/fr.js"></script>
  <script src="../js/common.js"></script>
  <script src="genre.js"></script>
</body>
</html>
