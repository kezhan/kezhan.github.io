<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le pont des syllabes · L'Île aux mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Le pont des syllabes — styles propres au jeu (variables de style.css : compatibles mode sombre) */
    .syllabes {
      --rive: 44px;
      --planche-h: 62px;
      --bois: #e2ad6f;
      --bois-2: #c68a4c;
      --bois-bord: #8a5a2b;
      --bois-ink: #3a220c;
      --liane: var(--palm);
      --terre: #b07a45;
      --eau: var(--sea-2);
      --syl-a: #c2410c;
      --syl-b: #1d6fb8;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) .syllabes { --syl-a: #ffa27f; --syl-b: #83c8ff; --terre: #8a5a32; }
    }
    :root[data-theme='dark'] .syllabes { --syl-a: #ffa27f; --syl-b: #83c8ff; --terre: #8a5a32; }
    @media (max-width: 480px) {
      .syllabes { --rive: 26px; --planche-h: 54px; }
    }

    .syl-figure {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .syl-figure .speak { width: 50px; height: 50px; }
    .syl-image {
      margin: 0;
      font-size: clamp(3.6rem, 16vw, 6rem);
      line-height: 1.15;
    }
    /* Niveau 3 : image cachée et indice de thème côte à côte. */
    .syl-figure--cachee { flex-wrap: wrap; gap: 10px 14px; }
    .syl-figure--cachee .syl-image {
      display: grid;
      place-items: center;
      width: 1.35em;
      height: 1.2em;
      font-size: clamp(3rem, 13vw, 4.5rem);
    }
    .syl-image.is-mystere {
      font-weight: 700;
      color: var(--ink-soft);
      background: var(--sand-2);
      border: 3px dashed var(--card-border);
      border-radius: 20px;
    }
    .syl-theme {
      margin: 0;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--sand-2);
      font-weight: 600;
      font-size: 1rem;
    }

    /* ---------- Le pont de lianes ---------- */
    .pont {
      position: relative;
      display: flex;
      align-items: flex-start;
      max-width: min(640px, calc(var(--n, 4) * 150px + 2 * var(--rive) + 8px));
      margin: 50px auto 8px;
      padding-bottom: 24px;
    }
    .pont::after { /* la rivière */
      content: '';
      position: absolute;
      left: var(--rive);
      right: var(--rive);
      bottom: 0;
      height: 26px;
      border-radius: 0 0 12px 12px;
      background:
        radial-gradient(circle at 12px 0, transparent 9px, rgba(255, 255, 255, 0.55) 10px, transparent 12px) 0 6px / 24px 12px repeat-x,
        linear-gradient(180deg, var(--sea-1), var(--eau));
      opacity: 0.85;
    }
    .pont__rive {
      position: relative;
      z-index: 1;
      flex: 0 0 var(--rive);
      align-self: stretch;
      background: linear-gradient(180deg, var(--palm) 0 12px, var(--terre) 12px 100%);
      border-radius: 12px 12px 4px 4px;
    }
    .pont__rive--g { border-top-left-radius: 18px; }
    .pont__rive--d { border-top-right-radius: 18px; }
    .pont__tablier {
      position: relative;
      z-index: 2;
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      gap: 4px;
      padding: 0 4px;
      margin-top: 6px;
    }
    .pont__tablier::before { /* liane tendue entre les deux rives */
      content: '';
      position: absolute;
      left: -8px;
      right: -8px;
      top: 50%;
      height: 5px;
      margin-top: -2px;
      border-radius: 3px;
      background: var(--liane);
    }
    .pont__tablier::after { /* liane qui pend sous le pont */
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% - 6px);
      height: 16px;
      border: 4px solid var(--liane);
      border-top: 0;
      border-radius: 0 0 50% 50%;
    }
    .planche {
      position: relative;
      z-index: 1;
      flex: 1 1 0; /* flex-grow ajusté en JS selon la longueur de la syllabe */
      min-width: 0;
      height: var(--planche-h);
      display: grid;
      place-items: center;
      padding: 0 2px;
      border-radius: 8px;
      font-weight: 700;
      font-size: clamp(1.1rem, 5.2vw, 1.75rem);
      line-height: 1;
      overflow-wrap: anywhere;
    }
    .planche.is-vide { border: 3px dashed var(--card-border); background: transparent; }
    .planche.is-posee {
      color: var(--bois-ink);
      background:
        repeating-linear-gradient(90deg, transparent 0 14px, rgba(90, 50, 20, 0.08) 14px 16px),
        linear-gradient(180deg, var(--bois), var(--bois-2));
      border: 3px solid var(--bois-bord);
      box-shadow: 0 4px 0 rgba(60, 35, 10, 0.25);
    }
    .pont.is-fini .planche.is-posee { border-color: var(--good); }
    .pont__singe {
      position: absolute;
      z-index: 3;
      bottom: calc(100% + 2px);
      left: calc(var(--rive) / -2);
      translate: -50% 0;
      font-size: 2.1rem;
      line-height: 1;
      transition: left 0.45s ease;
      pointer-events: none;
    }

    /* ---------- Tuiles-syllabes ---------- */
    .syl-tuiles { margin-top: 18px; }
    .syl-tuile { min-width: 72px; min-height: 60px; padding: 6px 14px; }
    /* Survol : la tuile se soulève de 2 px (style.css). Pendant le survol, on prolonge sa zone
       sensible vers le bas pour que le pointeur posé sur son bord ne la fasse pas trembler. */
    .syl-tuile { position: relative; }
    .syl-tuile:not(:disabled):hover::after {
      content: '';
      position: absolute;
      left: -3px;
      right: -3px;
      bottom: -6px;
      height: 6px;
    }
    .syl-tuile.is-used {
      opacity: 0.6;
      color: transparent;
      background: transparent;
      border-style: dashed;
      box-shadow: none;
    }
    .syl-tuile.is-wrong {
      opacity: 0.75;
      color: var(--bad);
      background: var(--bad-bg);
      border-color: var(--bad);
      text-decoration: line-through;
      box-shadow: none;
    }
    .syl-tuile.is-aide {
      border-color: #e0a800;
      box-shadow: 0 0 0 4px var(--sun), 0 4px 0 rgba(35, 50, 74, 0.15);
      animation: syl-brille 0.9s ease-in-out infinite alternate;
    }
    @keyframes syl-brille {
      from { box-shadow: 0 0 0 2px var(--sun), 0 4px 0 rgba(35, 50, 74, 0.15); }
      to { box-shadow: 0 0 0 7px var(--sun), 0 4px 0 rgba(35, 50, 74, 0.15); }
    }
    @media (max-width: 480px) {
      .syl-tuile { min-width: 60px; min-height: 54px; padding: 4px 10px; }
    }

    /* Le mot entier, syllabes en couleurs alternées */
    .syl-mot { margin: 18px 0 4px; letter-spacing: 0.02em; }
    .syl-mot .syl-a { color: var(--syl-a); }
    .syl-mot .syl-b { color: var(--syl-b); }
    .syl-feedback { min-height: 2.8em; line-height: 1.35; }

    /* ---------- Chinois : caractère + pinyin (tuiles, planches, mot final) ---------- */
    .syllabes .pinyin {
      display: block;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .syllabes--hanzi { --planche-h: 78px; }
    .syllabes--hanzi .syl-txt { display: block; line-height: 1.1; }
    .syllabes--hanzi .syl-tuile {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 76px;
      min-height: 80px;
      padding: 6px 12px 8px;
    }
    .syllabes--hanzi .syl-tuile .syl-txt { font-size: 2.1rem; font-weight: 600; }
    .syllabes--hanzi .syl-tuile .pinyin { font-size: 1rem; color: var(--ink-soft); }
    .syl-tuile.is-used .pinyin { color: transparent; }
    .syl-tuile.is-wrong .pinyin { color: var(--bad); text-decoration: line-through; }
    .syllabes--hanzi .planche {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      overflow-wrap: normal;
    }
    .syllabes--hanzi .planche .syl-txt { font-size: clamp(1.6rem, 7vw, 2.1rem); font-weight: 600; }
    .syllabes--hanzi .planche .pinyin { font-size: clamp(0.8rem, 3.6vw, 1rem); font-weight: 600; opacity: 0.85; }
    .syllabes--hanzi .syl-mot {
      display: flex;
      justify-content: center;
      gap: 0.12em;
      letter-spacing: 0.04em;
    }
    .syllabes--hanzi .syl-bloc {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 1.1em;
    }
    .syllabes--hanzi .syl-mot .pinyin { font-size: 0.42em; font-weight: 600; letter-spacing: 0.02em; }
    @media (max-width: 480px) {
      .syllabes--hanzi { --planche-h: 70px; }
      .syllabes--hanzi .syl-tuile { min-width: 66px; min-height: 72px; padding: 4px 8px 6px; }
      .syllabes--hanzi .syl-tuile .syl-txt { font-size: 1.85rem; }
      .syllabes--hanzi .syl-tuile .pinyin { font-size: 0.92rem; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main id="jeu"></main>
  <script src="../data/lang/en.js"></script>
  <script src="../data/lang/zh.js"></script>
  <script src="../data/lang/de.js"></script>
  <script src="../data/lang/lb.js"></script>
  <script src="../data/lang/fr.js"></script>
  <script src="../js/common.js"></script>
  <script src="syllabes.js"></script>
</body>
</html>
