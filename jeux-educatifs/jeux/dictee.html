<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La dictée du perroquet · L'Île aux mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ---- La dictée du perroquet / Parrot dictation / 鹦鹉听写 / Das Papageien-Diktat / D’Dictée vum Papagei ---- */
    .dictee .consigne { margin-bottom: 6px; }
    .dictee-emoji {
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif;
    }

    /* Écran d'accueil */
    .dictee-intro h2 { margin: 0 0 6px; font-size: clamp(1.5rem, 6vw, 2rem); text-wrap: balance; }
    .dictee-intro > p, .dictee .consigne, .dictee .feedback { text-wrap: balance; }
    .dictee-intro p { margin: 0 0 10px; font-size: 1.15rem; }
    .dictee-intro .dictee-perroquet { font-size: clamp(4.5rem, 22vw, 7rem); }
    .dictee-astuces {
      list-style: none;
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      margin: 4px auto 6px;
      padding: 12px 16px;
      text-align: left;
      background: var(--sand);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-sm);
      max-width: 100%;
    }
    .dictee-astuces li { display: flex; gap: 10px; align-items: baseline; }
    .dictee-go { font-size: 1.3rem; min-height: 60px; padding-inline: 32px; }

    /* Le perroquet et sa bulle */
    .dictee-scene {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 0 0 8px;
      min-height: 104px;
    }
    .dictee-perroquet {
      display: inline-block;
      font-size: clamp(3.4rem, 15vw, 5rem);
      line-height: 1;
      transform-origin: 50% 90%;
      user-select: none;
    }
    .dictee-perroquet.is-talking { animation: dictee-parle 0.8s ease-in-out 2; }
    @keyframes dictee-parle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-9deg) translateY(-5px); }
      75% { transform: rotate(7deg); }
    }
    .dictee-bulle {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 92px;
      min-height: 80px;
      max-width: min(100%, 440px);
      padding: 8px 18px;
      background: var(--sand);
      border: 3px solid var(--card-border);
      border-radius: 24px;
      font-size: clamp(2.4rem, 11vw, 3.4rem);
      line-height: 1.15;
    }
    .dictee-bulle::before {
      content: '';
      position: absolute;
      left: -11px;
      top: calc(50% - 9px);
      width: 16px;
      height: 16px;
      background: var(--sand);
      border-left: 3px solid var(--card-border);
      border-bottom: 3px solid var(--card-border);
      transform: rotate(45deg);
    }
    .dictee-bulle .mot-affiche {
      margin: 0;
      font-size: clamp(1.7rem, 7.5vw, 2.6rem);
      overflow-wrap: anywhere;
      color: var(--ink);
    }
    /* Mots longs (bibliothèque, Schmetterling, Waassermeloun…) : plus petits pour ne pas être coupés. */
    .dictee-bulle .mot-affiche--long { font-size: clamp(1.35rem, 6vw, 2.4rem); letter-spacing: 0.02em; }
    .dictee-perroquet { flex: 0 0 auto; }
    /* Mode « Mémorise » : le mot s'envole au bout de 3 secondes. */
    .dictee-bulle.is-memo { border-color: var(--sun); }
    .dictee-bulle.is-memo::after {
      content: '';
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 6px;
      height: 5px;
      border-radius: 99px;
      background: var(--sun);
      transform-origin: left center;
      animation: dictee-sablier var(--memo-ms, 3000ms) linear forwards;
    }
    @keyframes dictee-sablier { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .dictee-ecoute { margin-top: 4px; }
    .dictee-ecoute .btn { min-height: 48px; padding: 8px 16px; font-size: 1.05rem; }

    /* Phrase d'exemple (mots sans image) */
    .dictee-phrase {
      margin: 10px auto 0;
      max-width: 520px;
      font-size: 1.15rem;
      font-style: italic;
      color: var(--ink-soft);
    }
    .dictee-blanc {
      display: inline-block;
      min-width: 3.2em;
      border-bottom: 3px dashed var(--sea-2);
      vertical-align: baseline;
    }
    /* Le blanc reste collé à la ponctuation qui le suit (« … son ____. ») */
    .dictee-colle { white-space: nowrap; }

    /* Saisie */
    .dictee-form { margin-top: 14px; }
    .dictee-form .feedback { margin-top: 8px; }
    .dictee-valider { min-width: 150px; }
    .dictee-saisie {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .dictee-article { font-size: 1.5rem; font-weight: 600; flex: 0 0 auto; }
    .dictee-saisie .answer { flex: 0 1 380px; min-width: 0; }
    .dictee-saisie .answer:disabled { opacity: 0.6; }
    .dictee-touches {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 12px auto 0;
      max-width: 620px;
    }
    /* Largeur fixe : le script équilibre les lignes (4 + 3 plutôt que 6 + 1). */
    .dictee-touche {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      min-height: 46px;
      padding: 0;
      font: inherit;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1;
      color: var(--ink);
      background: var(--sand-2);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 3px 0 rgba(35, 50, 74, 0.15);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
    }
    .dictee-touche:hover { transform: translateY(-2px); }
    .dictee-touche:active { transform: translateY(1px); box-shadow: none; }
    .dictee-touche:disabled { opacity: 0.4; cursor: default; transform: none; }
    .dictee-form .actions { margin-top: 12px; }

    /* Correction */
    .dictee-correction {
      margin: 6px auto 0;
      padding: 10px 16px;
      max-width: 520px;
      background: var(--good-bg);
      border: 3px solid var(--good);
      border-radius: var(--radius-sm);
    }
    .dictee-correction__label { display: block; font-size: 1rem; color: var(--ink-soft); }
    .dictee-correction__mot {
      display: block;
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      overflow-wrap: anywhere;
    }
    .dictee-correction mark {
      padding: 0 2px;
      color: inherit;
      background: rgba(255, 201, 60, 0.55);
      border-radius: 6px;
      box-shadow: inset 0 -3px 0 #e0a800;
    }
    .dictee-sourd { font-size: 0.95rem; min-height: 44px; padding: 6px 14px; border-style: dashed; }

    .dictee-bas { margin-top: 20px; }

    /* ---- Chinois : caractères, pinyin et choix des caractères (niveau 1) ---- */
    .pinyin {
      display: block;
      font-size: 0.5em;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.01em;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .is-cache { visibility: hidden; }
    .dictee-hanzi {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: clamp(2rem, 9vw, 2.6rem);
      line-height: 1.15;
    }
    .dictee-hanzi__mot { font-weight: 600; letter-spacing: 0.08em; color: var(--ink); }
    .dictee-hanzi .pinyin { font-size: 0.5em; color: var(--good); }
    .dictee-memo-py { font-size: clamp(1.6rem, 7vw, 2.2rem); color: var(--ink); }
    .dictee-bulle.is-solution { border-color: var(--good); }
    .dictee-choix { max-width: 560px; margin: 4px auto 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dictee-choix__btn { flex-direction: column; gap: 0; min-height: 84px; padding: 6px 8px; line-height: 1.15; }
    .dictee-choix__han { font-size: clamp(1.9rem, 8vw, 2.4rem); font-weight: 600; letter-spacing: 0.06em; }
    .dictee-choix__btn .pinyin { font-size: 0.95rem; }
    .dictee-choix__btn.is-correct .pinyin { color: var(--good); }
    .dictee-choix__btn.is-wrong .pinyin { color: var(--bad); }
    .dictee-choix__btn:disabled.is-correct { opacity: 1; }
    .dictee-choix.is-fini .choice:not(.is-correct):not(.is-wrong) { opacity: 0.55; }
    .dictee--zh .dictee-saisie .answer { letter-spacing: 0.04em; }
    /* Consignes chinoises : retour à la ligne après la ponctuation (。，！) plutôt qu'au milieu
       d'un mot (« 仔细 / 听 ») ; une phrase trop longue se coupe quand même. */
    .dictee--zh .dictee-intro > p, .dictee--zh .dictee-astuces, .dictee--zh .consigne, .dictee--zh .feedback {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      /* Accueil compact : le bouton « Commencer » reste visible sans défiler. */
      .dictee-intro .dictee-perroquet { font-size: 3.6rem; }
      .dictee-intro h2 { font-size: 1.4rem; margin-bottom: 4px; }
      .dictee-intro p { margin-bottom: 6px; }
      .dictee-astuces { gap: 4px; padding: 8px 12px; font-size: 0.95rem; }
      .dictee-intro .actions { margin-top: 10px; }
      .dictee-form { margin-top: 10px; }
      .dictee-bas { margin-top: 12px; }
      .dictee-choix__btn { min-height: 76px; }
      .dictee-scene { gap: 14px; min-height: 92px; }
      .dictee-bulle { min-height: 72px; padding: 6px 14px; }
      .dictee-article { font-size: 1.3rem; }
      .dictee-saisie .answer { font-size: 1.45rem; padding: 8px 10px; }
      .dictee-intro p { font-size: 1.05rem; }
      .dictee .consigne { font-size: 1.1rem; }
      .dictee-ecoute { gap: 6px; flex-wrap: nowrap; }
      .dictee-ecoute .btn { min-height: 46px; padding: 6px 10px; gap: 4px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main id="jeu"></main>
  <script src="../data/lang/en.js"></script>
  <script src="../data/lang/zh.js"></script>
  <script src="../data/lang/de.js"></script>
  <script src="../data/lang/lb.js"></script>
  <script src="../data/lang/fr.js"></script>
  <script src="../js/common.js"></script>
  <script src="dictee.js"></script>
</body>
</html>
