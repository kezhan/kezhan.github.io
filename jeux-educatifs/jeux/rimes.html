<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La chasse aux rimes · L'Île aux mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ---- La chasse aux rimes / Rhyme hunt / 找押韵的字 / Die Reimjagd / D’Reimjuegd ---- */
    .rimes {
      --rm-fin-bg: rgba(255, 201, 60, 0.55);
      --rm-fin-ink: #6b3f00;
      --rm-fin-line: #e0a800;
      --rm-cible-bg: #eaf7fd;
      --rm-cible-border: #9ed8ef;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) .rimes {
        --rm-fin-bg: rgba(255, 201, 60, 0.28);
        --rm-fin-ink: #ffe08a;
        --rm-cible-bg: #1d3553;
        --rm-cible-border: #35608f;
      }
    }
    :root[data-theme='dark'] .rimes {
      --rm-fin-bg: rgba(255, 201, 60, 0.28);
      --rm-fin-ink: #ffe08a;
      --rm-cible-bg: #1d3553;
      --rm-cible-border: #35608f;
    }
    .rimes .consigne { margin-bottom: 10px; }
    .rm-emoji {
      /* Emojis en couleur même si une police monochrome les connaît. */
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif;
      font-weight: 400;
      line-height: 1;
    }

    /* Le mot à faire rimer : image, mot (et pinyin), bouton « écouter ». */
    .rm-cible {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 16px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 6px;
      padding: 12px 20px;
      background: var(--rm-cible-bg);
      border: 3px solid var(--rm-cible-border);
      border-radius: 22px;
    }
    .rm-cible .rm-emoji { font-size: clamp(3rem, 13vw, 4.4rem); }
    .rm-cible .speak { width: 50px; height: 50px; }
    .rm-cible__mot {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      max-width: 100%;
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    :lang(zh) .rm-cible__mot .rm-texte { font-size: 1.2em; letter-spacing: 0.04em; }

    /* Pinyin : petit, clair, sous les caractères. */
    .pinyin {
      display: block;
      font-size: 0.62em;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.01em;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .rm-cible__mot .pinyin { font-size: 0.5em; margin-top: 2px; }

    /* Terminaison commune, mise en évidence après la réponse. */
    .rm-fin {
      padding: 0 0.06em;
      border-radius: 0.2em;
      background: var(--rm-fin-bg);
      color: var(--rm-fin-ink);
      box-shadow: inset 0 -0.12em 0 var(--rm-fin-line);
      font-weight: 700;
    }
    .pinyin .rm-fin { color: var(--rm-fin-ink); }

    .rm-note {
      margin: 8px auto 0;
      max-width: 34em;
      font-size: 0.98rem;
      color: var(--ink-soft);
    }

    /* Propositions : le mot (bouton de réponse) et son bouton « écouter » à côté. */
    .rm-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 16px;
      max-width: 680px;
      margin: 14px auto 0;
    }
    .rm-options--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 820px; }
    .rm-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .rm-choice {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 68px;
      flex-direction: row;
      gap: 10px;
      padding: 8px 12px;
      line-height: 1.15;
    }
    .rm-choice .rm-emoji { font-size: 1.6rem; flex: 0 0 auto; }
    .rm-choice__mot {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      overflow-wrap: normal;
      word-break: normal;
    }
    :lang(zh) .rm-choice .rm-texte { font-size: 1.3em; letter-spacing: 0.04em; }
    .rm-choice .pinyin { font-size: 0.78em; }
    /* Pinyin de la bonne réponse : couleur du texte (le vert sur fond vert est illisible, surtout en sombre). */
    .rm-choice.is-correct .pinyin { color: inherit; }
    .rm-choice.is-wrong .pinyin { color: var(--bad); }
    .rm-choice:disabled.is-correct { opacity: 1; cursor: default; }
    .rm-options.is-fini .rm-choice:disabled { opacity: 1; }
    .rm-options.is-fini .rm-option:not(.is-bonne) { opacity: 0.55; }
    .rm-option .speak { width: 44px; height: 44px; font-size: 1.25rem; }

    /* Message : la rime entendue (« 🎵 -at », « 🎵 ao »). */
    .rm-feedback { min-height: 2.8em; line-height: 1.45; }
    .rm-son {
      display: inline-block;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--rm-fin-bg);
      color: var(--rm-fin-ink);
      white-space: nowrap;
    }

    /* Tablette étroite et téléphone : une proposition par ligne, bouton « écouter » à droite. */
    @media (max-width: 640px) {
      .rm-options, .rm-options--3 { grid-template-columns: minmax(0, 1fr); max-width: 420px; gap: 10px; }
      .rm-choice { min-height: 60px; }
    }
    @media (max-width: 480px) {
      .rm-cible { padding: 10px 14px; gap: 6px 12px; }
      .rm-choice { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main id="jeu"></main>
  <script src="../data/lang/en.js"></script>
  <script src="../data/lang/zh.js"></script>
  <script src="../data/lang/de.js"></script>
  <script src="../data/lang/lb.js"></script>
  <script src="../data/lang/fr.js"></script>
  <script src="../js/common.js"></script>
  <script src="rimes.js"></script>
</body>
</html>
