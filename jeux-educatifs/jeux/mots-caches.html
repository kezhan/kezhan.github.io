<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mots cachés · L'Île aux mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Mots cachés / Word search / 藏起来的词 / Versteckte Wörter / Verstoppt Wierder —
       styles propres au jeu (variables de style.css : compatibles mode sombre) */
    .mc {
      --mc-max: 360px;
      --mc-alpha: 0.5;
      /* Couleurs des mots trouvés (triplets RGB, utilisés avec une transparence) */
      --mc-c0: 255 196 40;
      --mc-c1: 255 122 89;
      --mc-c2: 46 170 96;
      --mc-c3: 47 163 214;
      --mc-c4: 150 110 255;
      --mc-c5: 240 98 170;
      --mc-survol: rgba(35, 50, 74, 0.07);
      --mc-indice: #e0a800;
    }
    .mc--n8 { --mc-max: 440px; }
    .mc--n10 { --mc-max: 480px; }
    /* Chinois : grilles de caractères plus petites (5×5, 6×6, 7×7), cases plus grandes. */
    .mc--n5 { --mc-max: 330px; }
    .mc--n6 { --mc-max: 370px; }
    .mc--n7 { --mc-max: 410px; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) .mc { --mc-alpha: 0.62; --mc-survol: rgba(255, 255, 255, 0.08); }
    }
    :root[data-theme='dark'] .mc { --mc-alpha: 0.62; --mc-survol: rgba(255, 255, 255, 0.08); }

    /* Progression et bouton d'indice sur la même ligne */
    .mc-haut {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .mc-haut .progress { flex: 1 1 auto; min-width: 0; margin: 0; }
    .mc-indice { flex: none; min-height: 46px; padding: 6px 14px; font-size: 1.05rem; }

    .mc .consigne { margin-bottom: 6px; }
    .mc-note {
      display: inline-block;
      margin: 0 0 6px;
      padding: 3px 12px;
      border-radius: 12px;
      background: var(--sand-2);
      font-size: 0.92rem;
      line-height: 1.3;
      font-weight: 500;
    }

    .mc-jeu {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 28px;
      justify-content: center;
      align-items: flex-start;
      margin-top: 10px;
    }

    /* ---------- Grille ---------- */
    .mc-plateau {
      position: relative;
      flex: 0 0 auto;
      width: min(100%, var(--mc-max));
      aspect-ratio: 1 / 1;
      background: var(--card);
      border: 3px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 4px 0 rgba(35, 50, 74, 0.1);
      container-type: inline-size;
      touch-action: none; /* le doigt glisse sur la grille sans faire défiler la page */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mc-traits,
    .mc-grille {
      position: absolute;
      inset: 4px;
    }
    .mc-traits { pointer-events: none; }
    .mc-grille {
      display: grid;
      grid-template-columns: repeat(var(--n), minmax(0, 1fr));
      grid-template-rows: repeat(var(--n), minmax(0, 1fr));
    }
    .mc-case {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font-family: var(--font);
      font-weight: 600;
      line-height: 1;
      font-size: clamp(1rem, 5vw, 1.7rem); /* repli sans unités de conteneur */
      font-size: calc(100cqi / var(--n) * 0.56);
      cursor: pointer;
      touch-action: none;
    }
    @media (hover: hover) {
      .mc-case:hover { background: var(--mc-survol); }
    }
    .mc-case:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; border-radius: 10px; }
    .mc-case.is-trouvee { font-weight: 700; }
    /* Caractères chinois : un peu plus grands, graisse normale (les polices CJK n'ont souvent pas de gras). */
    .mc--hanzi .mc-case { font-weight: 500; font-size: calc(100cqi / var(--n) * 0.6); }
    .mc--hanzi .mc-case.is-trouvee { font-weight: 700; }
    .mc-case.is-indice {
      background: rgb(var(--mc-c0) / 0.4);
      box-shadow: inset 0 0 0 3px var(--mc-indice);
      animation: mc-clignote 0.45s ease-in-out 8 alternate;
    }
    @keyframes mc-clignote {
      from { background: rgb(var(--mc-c0) / 0.15); box-shadow: inset 0 0 0 2px var(--mc-indice); }
      to { background: rgb(var(--mc-c0) / 0.85); box-shadow: inset 0 0 0 4px var(--mc-indice); }
    }

    /* Traits de surlignage (sous les lettres) */
    .mc-trait {
      position: absolute;
      border-radius: 999px;
      background: rgb(var(--c, var(--mc-c3)) / var(--mc-alpha));
    }
    .mc-trait.is-nouveau { animation: mc-trace 0.35s ease-out; }
    @keyframes mc-trace { from { opacity: 0; } to { opacity: 1; } }
    .mc-trait--selection {
      background: rgba(108, 76, 255, 0.16);
      border: 3px solid var(--focus);
    }
    .mc-trait--apercu { border-style: dashed; background: rgba(108, 76, 255, 0.08); }
    .mc-trait--faux {
      background: var(--bad-bg);
      border: 3px solid var(--bad);
      animation: mc-efface 0.7s ease-in forwards;
    }
    @keyframes mc-efface { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }

    /* ---------- Liste des mots ---------- */
    .mc-cote {
      flex: 1 1 220px;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .mc-titre-liste {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink-soft);
    }
    .mc-liste {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mc-mot {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 5px 12px;
      font: inherit;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      text-align: left;
      color: var(--ink);
      background: var(--sand-2);
      border: 3px solid var(--card-border);
      border-radius: 12px;
      touch-action: manipulation;
    }
    button.mc-mot { cursor: pointer; box-shadow: 0 3px 0 rgba(35, 50, 74, 0.12); }
    button.mc-mot:active { transform: translateY(1px); }
    .mc-mot__emoji { font-size: 1.5rem; line-height: 1; flex: none; }
    .mc-mot__texte { flex: 1 1 auto; min-width: 0; white-space: nowrap; }
    .mc-mot__etat { flex: none; font-size: 1.1rem; }
    .mc-mot__etat:empty { display: none; }
    .mc-mot.is-found {
      border-color: rgb(var(--c));
      background: rgb(var(--c) / 0.22);
    }
    .mc-mot.is-found .mc-mot__texte {
      text-decoration: line-through;
      text-decoration-thickness: 3px;
      color: var(--ink-soft);
    }
    .mc-mot.is-aide:not(.is-found) { border-color: var(--mc-indice); border-style: dashed; }

    /* Chinois : pinyin (niveaux 1–2), cases vides (niveau 3), puis caractères + pinyin une fois trouvé. */
    .pinyin {
      display: block;
      font-size: 0.8em;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.01em;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .mc--hanzi .mc-mot { letter-spacing: 0; }
    .mc-mot__texte--py .mc-mot__py { font-size: 1.05rem; font-weight: 600; color: var(--ink); }
    .mc-mot__texte--hanzi { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
    .mc-mot__hanzi { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.08em; }
    .mc-mot.is-found .mc-mot__texte--hanzi { text-decoration: none; color: var(--ink); }
    .mc-mot.is-found .mc-mot__hanzi {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgb(35 50 74 / 0.45);
    }
    .mc-mot__cases { display: inline-flex; gap: 4px; }
    .mc-mot__case {
      width: 1.35em;
      height: 1.35em;
      border: 2px dashed var(--ink-soft);
      border-radius: 6px;
      opacity: 0.7;
    }
    .mc-fb-py { display: inline; font-size: 0.85em; color: inherit; opacity: 0.85; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) .mc-mot.is-found .mc-mot__hanzi { text-decoration-color: rgb(255 255 255 / 0.5); }
    }
    :root[data-theme='dark'] .mc-mot.is-found .mc-mot__hanzi { text-decoration-color: rgb(255 255 255 / 0.5); }

    .mc .feedback { min-height: 2.6em; }

    /* Téléphones et tablettes en portrait : la liste au-dessus de la grille, en étiquettes. */
    @media (max-width: 820px) {
      .mc-jeu { flex-direction: column; align-items: center; gap: 12px; }
      .mc-cote { order: -1; width: 100%; max-width: none; flex: none; }
      .mc-titre-liste { display: none; }
      .mc-liste {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 6px;
      }
      .mc-liste > li { display: flex; flex: 0 1 auto; min-width: 0; max-width: 100%; }
      .mc-mot {
        min-height: 44px;
        padding: 3px 10px;
        gap: 6px;
        font-size: 1.05rem;
        letter-spacing: 0.03em;
      }
      .mc-mot__emoji { font-size: 1.3rem; }
      .mc-mot__etat { position: absolute; top: -10px; right: -6px; font-size: 1rem; }
    }

    @media (max-width: 480px) {
      /* L'en-tête commun fait trois lignes (~200 px) sur téléphone : collé en haut, il cacherait
         la liste ou la grille. Dans ce jeu, il défile avec la page (voir cadrer() dans le script). */
      .topbar { position: static; }
      .panel.mc { padding: 12px 8px 12px; }
      .mc-haut { gap: 8px; margin-bottom: 8px; }
      .mc-haut .progress { gap: 8px; }
      .mc-compteur__titre { display: none; }
      .mc .consigne { font-size: 1rem; line-height: 1.3; }
      .mc-jeu { margin-top: 6px; gap: 10px; }
      .mc-liste { gap: 6px 5px; }
      .mc-mot { padding: 3px 8px; font-size: 0.98rem; letter-spacing: 0.01em; }
      .mc-mot__emoji { font-size: 1.2rem; }
      .mc .feedback { font-size: 1.05rem; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main id="jeu"></main>
  <script src="../data/lang/en.js"></script>
  <script src="../data/lang/zh.js"></script>
  <script src="../data/lang/de.js"></script>
  <script src="../data/lang/lb.js"></script>
  <script src="../data/lang/fr.js"></script>
  <script src="../js/common.js"></script>
  <script src="mots-caches.js"></script>
</body>
</html>
