<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Un ou plusieurs · L'Île aux mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ---- Un ou plusieurs / One or many / Eins oder viele / Eent oder vill (pas de version chinoise) ---- */
    .pluriel .consigne { margin-bottom: 10px; }
    .pluriel-emoji {
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif;
    }

    /* Les deux cartes : « un chat » → « des … » */
    .pluriel-duo {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      margin: 0 0 12px;
    }
    .pluriel-carte {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 8px;
      background: var(--sand);
      border: 3px solid var(--card-border);
      border-radius: var(--radius);
    }
    .pluriel-carte--des { border-style: dashed; border-color: var(--sea-2); }
    .pluriel-carte--des.is-good { border-style: solid; border-color: var(--good); background: var(--good-bg); }
    .pluriel-carte--des.is-bad { border-style: solid; border-color: var(--bad); }
    .pluriel-images {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 1.2em;
      font-size: clamp(2.3rem, 10vw, 3.6rem);
      line-height: 1.15;
      white-space: nowrap;
      user-select: none;
    }
    /* Plusieurs images un peu serrées : on voit « un groupe ». */
    .pluriel-images--des { font-size: clamp(1.9rem, 8.2vw, 3.2rem); }
    .pluriel-images--des span + span { margin-left: -0.18em; }
    .pluriel-images--des span:nth-child(2) { transform: translateY(-0.12em) rotate(-6deg); }
    .pluriel-images--des span:nth-child(3) { transform: rotate(6deg); }
    .pluriel-texte {
      margin: 0;
      font-size: clamp(1.35rem, 5.6vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .pluriel-texte--long { font-size: clamp(1.1rem, 4.6vw, 1.8rem); }
    .pluriel-texte--tres-long { font-size: clamp(1.05rem, 4.2vw, 1.65rem); }
    .pluriel-texte--sans-image { font-size: clamp(1.5rem, 6.4vw, 2.3rem); }
    .pluriel-texte--sans-image.pluriel-texte--long { font-size: clamp(1.15rem, 4.9vw, 2rem); }
    .pluriel-art { font-weight: 600; color: var(--ink-soft); }
    .pluriel-trou {
      display: inline-block;
      min-width: 2.4em;
      border-bottom: 4px dashed var(--sea-2);
      color: var(--ink-soft);
      text-align: center;
    }
    .pluriel-fin {
      padding: 0 1px;
      color: var(--good);
      background: rgba(34, 165, 90, 0.16);
      border-radius: 6px;
      box-shadow: inset 0 -3px 0 var(--good);
    }
    .pluriel-fleche {
      align-self: center;
      flex: 0 0 auto;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--sea-2);
    }
    .pluriel-entete {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .pluriel-entete .consigne { margin: 0; }
    .pluriel-entete .speak { width: 44px; height: 44px; font-size: 1.2rem; }
    .pluriel-zone-regle:empty,
    .pluriel .actions:empty { display: none; }

    /* Choix (niveaux 1 et 2) */
    .pluriel .choices { margin-top: 4px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pluriel .choices--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (min-width: 900px) {
      .pluriel .choices:not(.choices--3) { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .pluriel .choice:disabled { opacity: 1; cursor: default; transform: none; }
    .pluriel .choice:disabled:not(.is-correct):not(.is-wrong) { opacity: 0.5; }

    /* Saisie (niveau 3) */
    .pluriel-saisie {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .pluriel-saisie .pluriel-art { font-size: 1.5rem; flex: 0 0 auto; }
    .pluriel-saisie .answer { flex: 0 1 380px; min-width: 0; }
    .pluriel-saisie .answer:disabled { opacity: 0.7; }
    /* Article élidé (luxembourgeois d’) : collé à la case, comme dans « d’Kazen ». */
    .pluriel-saisie--elide { gap: 4px; }
    .pluriel-touches {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 12px auto 0;
    }
    /* Largeur fixe : le script équilibre les lignes (4 + 3 plutôt que 6 + 1). */
    .pluriel-touche {
      width: 44px;
      min-height: 46px;
      padding: 0;
      font: inherit;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1;
      color: var(--ink);
      background: var(--sand-2);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 3px 0 rgba(35, 50, 74, 0.15);
      cursor: pointer;
      touch-action: manipulation;
    }
    .pluriel-touche:active { transform: translateY(1px); box-shadow: none; }
    .pluriel-form .actions { margin-top: 12px; }
    .pluriel-form .feedback { margin-top: 8px; }

    /* Rappel de la règle */
    .pluriel-regle {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 10px auto 0;
      max-width: 560px;
      padding: 10px 14px;
      text-align: left;
      font-size: 1.1rem;
      background: var(--sand);
      border: 2px solid var(--card-border);
      border-left: 6px solid var(--sun);
      border-radius: var(--radius-sm);
    }
    .pluriel-regle__texte { min-width: 0; overflow-wrap: anywhere; }
    /* « -er », « a → ä » : jamais coupés en fin de ligne. */
    .pluriel-insecable { white-space: nowrap; }

    /* Téléphone : les deux cartes l'une sous l'autre, en lignes, pour que les mots
       longs (kangourous, strawberries, Schmetterlinge, Schlaangen…) tiennent sans être coupés. */
    @media (max-width: 520px) {
      .pluriel-duo { flex-direction: column; align-items: stretch; gap: 2px; }
      .pluriel-carte {
        flex: 0 0 auto;
        max-width: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
        min-height: 72px;
        padding: 6px 12px;
      }
      .pluriel-images { flex: 0 0 88px; width: 88px; font-size: 2.4rem; }
      .pluriel-images--des { font-size: 1.8rem; }
      .pluriel-images--des span + span { margin-left: -0.32em; }
      .pluriel-texte { flex: 1 1 auto; min-width: 0; text-align: left; font-size: 1.4rem; }
      .pluriel-texte--long { font-size: 1.22rem; }
      .pluriel-texte--tres-long { font-size: 1.12rem; }
      .pluriel-texte--sans-image { text-align: center; font-size: 1.6rem; }
      .pluriel-texte--sans-image.pluriel-texte--long { font-size: 1.4rem; }
      .pluriel-fleche { transform: rotate(90deg); font-size: 1.2rem; line-height: 1; }
      .pluriel .choices--3 .choice { padding: 8px 2px; }
      .pluriel-saisie .pluriel-art { font-size: 1.3rem; }
      .pluriel-saisie .answer { font-size: 1.45rem; padding: 8px 10px; }
      .pluriel-regle { font-size: 1.02rem; padding: 8px 12px; }
      .pluriel-entete { gap: 8px; }
      .pluriel-entete .consigne { font-size: 1.08rem; }
    }
    /* Mots trop longs pour trois boutons côte à côte (le script ajoute choices--serre) :
       deux choix, puis le troisième centré dessous. */
    .pluriel .choices--3.choices--serre { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pluriel .choices--3.choices--serre .choice:last-child {
      grid-column: 1 / -1;
      justify-self: center;
      width: calc(50% - 6px);
    }
    @media (max-width: 360px) {
      .pluriel .choice { padding: 8px 2px; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main id="jeu"></main>
  <script src="../data/lang/en.js"></script>
  <script src="../data/lang/zh.js"></script>
  <script src="../data/lang/de.js"></script>
  <script src="../data/lang/lb.js"></script>
  <script src="../data/lang/fr.js"></script>
  <script src="../js/common.js"></script>
  <script src="pluriel.js"></script>
</body>
</html>
