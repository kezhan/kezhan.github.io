<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Les noix de coco · L'Île aux mots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ---- Les noix de coco / Coconut drop / 椰子掉下来 / Die Kokosnüsse / D’Kokosnëss ---- */
    .pendu {
      --ciel-1: #aee4f6;
      --ciel-2: #e6f7fd;
      --mer: #2fa3d6;
      --sable: #f3d58c;
      --tronc: #a0703f;
      --tronc-2: #7c5230;
      --coque: #7b4a26;
      --reflet: #b07a45;
      padding-top: clamp(12px, 3vw, 24px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) .pendu {
        --ciel-1: #13294a; --ciel-2: #2a4d7a; --mer: #1a6fa3; --sable: #c9a86a;
      }
    }
    :root[data-theme='dark'] .pendu { --ciel-1: #13294a; --ciel-2: #2a4d7a; --mer: #1a6fa3; --sable: #c9a86a; }

    .pendu .consigne { margin-bottom: 10px; }

    /* Le palmier (à gauche) et l'indice (à droite). */
    .pendu-haut {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 32px);
    }
    .pendu-scene {
      position: relative;
      flex: 0 1 270px;
      min-width: 0;
      aspect-ratio: 220 / 190;
      overflow: hidden;
      border: 3px solid var(--card-border);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--ciel-1), var(--ciel-2));
    }
    .pendu-scene svg { display: block; width: 100%; height: 100%; }
    .pendu-soleil { fill: var(--sun); }
    .pendu-nuage { fill: #fff; opacity: 0.9; }
    .pendu-mer { fill: var(--mer); }
    .pendu-sable { fill: var(--sable); }
    .pendu-tronc { fill: none; stroke: var(--tronc); stroke-width: 12; stroke-linecap: round; }
    .pendu-tronc-anneaux { fill: none; stroke: var(--tronc-2); stroke-width: 12; stroke-dasharray: 2.5 7; }
    .pendu-feuille { fill: var(--palm); }
    .pendu-feuille--fonce { fill: var(--palm-dark); }
    .pendu-noix__coque { fill: var(--coque); stroke: #5a3417; stroke-width: 1; }
    .pendu-noix__reflet { fill: var(--reflet); }
    .pendu-noix__oeil { fill: #4a2a12; }

    .pendu-couronne { transform-box: view-box; transform-origin: 110px 62px; }
    .pendu-scene.is-gagne .pendu-couronne { animation: pendu-danse 0.9s ease-in-out 2; }
    @keyframes pendu-danse {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    /* Une noix qui tombe : elle hésite, tombe, rebondit sur le sable et roule un peu. */
    .pendu-noix { transform-box: fill-box; transform-origin: center; }
    .pendu-noix.is-tombee { animation: pendu-chute 1.1s forwards; }
    @keyframes pendu-chute {
      0% { transform: translate(0, 0) rotate(0); animation-timing-function: ease-in-out; }
      10% { transform: translate(-2px, 0) rotate(-14deg); }
      20% { transform: translate(2px, 0) rotate(10deg); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
      62% { transform: translate(calc(var(--dx) * 0.55), var(--dy)) rotate(120deg); animation-timing-function: cubic-bezier(0, 0.55, 0.45, 1); }
      76% { transform: translate(calc(var(--dx) * 0.8), calc(var(--dy) - 12px)) rotate(200deg); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
      88% { transform: translate(calc(var(--dx) * 0.95), var(--dy)) rotate(250deg); }
      94% { transform: translate(var(--dx), calc(var(--dy) - 3px)) rotate(262deg); }
      100% { transform: translate(var(--dx), var(--dy)) rotate(270deg); }
    }

    .pendu-info {
      flex: 0 1 200px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .pendu-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(84px, 24vw, 120px);
      height: clamp(84px, 24vw, 120px);
      font-size: clamp(3.2rem, 14vw, 5rem);
      line-height: 1;
      /* Emojis en couleur même si une police monochrome les connaît. */
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif;
      user-select: none;
    }
    .pendu-image.is-mystere {
      border: 3px dashed var(--card-border);
      border-radius: 18px;
      background: var(--sand-2);
      font-family: var(--font);
      font-size: clamp(2.4rem, 10vw, 3.4rem);
      font-weight: 700;
      color: var(--ink-soft);
    }
    .pendu-longueur {
      margin: 0;
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--ink-soft);
    }
    .pendu-longueur strong { display: block; font-size: 2.2rem; line-height: 1.1; color: var(--ink); }
    .pendu-ligne { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .pendu-compteur {
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--sand-2);
      font-weight: 700;
      font-size: 1.1rem;
      white-space: nowrap;
    }
    .pendu-compteur.is-alerte { background: var(--bad-bg); color: var(--bad); }
    .pendu-indice { min-height: 48px; padding: 6px 16px; font-size: 1.05rem; }

    /* Le mot : une case par lettre, toujours sur une seule ligne, avec sa vraie casse (Katze). */
    .pendu-mot {
      --n: 5;
      display: grid;
      grid-template-columns: repeat(var(--n), minmax(0, 3.1rem));
      justify-content: center;
      gap: clamp(3px, 1.2vw, 8px);
      width: 100%;
      margin: 18px auto 0;
      container-type: inline-size;
    }
    .pendu-case {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 1.45em;
      font-size: 1.6rem;
      font-size: min(2.2rem, calc(100cqi / var(--n) * 0.78));
      font-weight: 700;
      line-height: 1.2;
      border-bottom: 4px solid var(--ink-soft);
      color: var(--ink);
    }
    .pendu-case.is-trouvee { border-bottom-color: var(--palm); animation: ile-pop 0.45s ease; }
    .pendu-case.is-manquee { border-bottom-color: var(--coral); color: var(--coral); }
    .pendu-case--signe { border-bottom-color: transparent; }

    /* Chinois : un bloc par syllabe, le caractère au-dessus de ses lettres de pinyin,
       la syllabe avec son ton dessous à la fin du mot. */
    .pendu-mot--zh {
      --s: 2;
      --gap-syl: clamp(10px, 3vw, 20px);
      --gap-l: clamp(3px, 1vw, 6px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: var(--gap-syl);
      margin-top: 12px;
    }
    .pendu-mot--zh > * {
      /* Largeur d'une case : tout le mot tient sur une ligne, 2,8rem au plus. */
      --case: min(2.8rem, calc((100cqi - (var(--s) - 1) * var(--gap-syl) - (var(--n) - var(--s)) * var(--gap-l)) / var(--n)));
    }
    .pendu-syl { display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .pendu-syl__han {
      font-size: clamp(1.5rem, calc(var(--case) * 1.25), 2.8rem);
      font-weight: 600;
      line-height: 1.15;
      color: var(--ink);
    }
    .pendu-syl__cases { display: flex; gap: var(--gap-l); }
    /* Lettres de pinyin (minuscules, étroites) : aussi grandes que la case le permet, pour rester
       lisibles dans les mots longs (shengrikuaile, 13 lettres sur un téléphone). */
    .pendu-mot--zh .pendu-case { width: var(--case); height: 1.3em; font-size: min(2.1rem, calc(var(--case) * 0.92)); }
    .pinyin {
      display: block;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.01em;
      color: var(--good);
      white-space: nowrap;
    }
    .pendu-syl__py { margin-top: 3px; font-size: clamp(0.95rem, calc(var(--case) * 0.55), 1.35rem); }
    .pendu-mot[data-etat='perdu'] .pinyin { color: var(--coral); }
    .is-cache { visibility: hidden; }
    .pendu-hanzi { margin: 12px 0 0; font-size: 2.4rem; font-weight: 600; line-height: 1.2; }
    .pendu-hanzi__py { font-size: 1.2rem; }

    .pendu .feedback {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.7em;
      margin: 8px 0 4px;
      line-height: 1.25;
    }

    /* Clavier de la langue (26 à 30 touches) : le jeu calcule --cols pour des lignes équilibrées
       et des touches d'au moins 44 px (2 lignes sur ordinateur, 4 ou 5 sur téléphone). */
    .pendu-clavier {
      --cols: 13;
      --gap: 6px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap);
      max-width: 780px;
      margin: 0 auto;
    }
    .pendu-touche {
      flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));
      min-width: 0;
      min-height: 54px;
      padding: 0 0 2px;
      font: inherit;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1;
      color: var(--ink);
      background: var(--sand-2);
      border: 3px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 4px 0 rgba(35, 50, 74, 0.15);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s, background 0.2s;
    }
    .pendu-touche:hover:not(:disabled) { transform: translateY(-2px); }
    .pendu-touche:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(35, 50, 74, 0.15); }
    .pendu-touche:disabled { cursor: default; box-shadow: none; transform: translateY(2px); }
    .pendu-touche.is-bonne { background: var(--good-bg); border-color: var(--good); color: var(--good); }
    .pendu-touche.is-mauvaise { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); opacity: 0.45; }
    .pendu-clavier.is-fini .pendu-touche:not(.is-bonne):not(.is-mauvaise) { opacity: 0.5; }

    @media (min-width: 600px) {
      .pendu-scene { flex-basis: 300px; }
    }
    /* Écrans d'ordinateur peu hauts (1280 × 800) : le palmier rapetisse pour que tout tienne. */
    @media (min-width: 600px) and (max-height: 860px) {
      .pendu-scene { flex-basis: 250px; }
      .pendu .feedback { min-height: 2.2em; }
    }
    @media (max-width: 820px) {
      .pendu-clavier { --gap: 8px; }
      .pendu-touche { min-height: 58px; font-size: 1.7rem; }
    }
    @media (max-width: 560px) {
      .pendu-clavier { --gap: 6px; }
      .pendu-touche { min-height: 52px; }
    }
    @media (max-width: 480px) {
      main#jeu { padding: 12px 8px 16px; }
      .pendu { padding: 12px 6px 14px; }
      .pendu .progress { margin-bottom: 8px; }
      .pendu .consigne { font-size: 1.02rem; margin-bottom: 8px; }
      .pendu-haut { gap: 10px; }
      .pendu-scene { flex-basis: 40%; border-radius: 14px; }
      /* L'image (ou la longueur) et l'indice côte à côte, le compteur dessous : moins haut. */
      .pendu-info { flex-basis: 60%; flex-direction: row; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px; }
      .pendu-syl__han { font-size: clamp(1.4rem, calc(var(--case) * 1.2), 2.3rem); }
      .pendu-image { width: 70px; height: 70px; font-size: 3.2rem; }
      .pendu-image.is-mystere { font-size: 2.3rem; border-radius: 14px; }
      .pendu-longueur { font-size: 1.05rem; }
      .pendu-longueur strong { font-size: 1.9rem; }
      .pendu-compteur { font-size: 1rem; padding: 3px 10px; }
      .pendu-indice { padding: 6px 12px; min-height: 46px; }
      .pendu-mot { margin-top: 12px; }
      .pendu-mot--zh { margin-top: 8px; --gap-syl: 8px; --gap-l: 3px; }
      .pendu .feedback { font-size: 1.08rem; margin: 6px 0 4px; }
      .pendu-clavier { --gap: 4px; }
      .pendu-touche { min-height: 48px; font-size: 1.45rem; border-width: 2px; border-radius: 10px; }
    }
    /* Téléphones peu hauts (375 × 667, 375 × 740…) : le jeu tient sans défiler,
       touches toujours d'au moins 44 px. */
    @media (max-width: 480px) and (max-height: 800px) {
      main#jeu { padding-top: 8px; padding-bottom: 8px; }
      .pendu { padding-top: 10px; padding-bottom: 8px; }
      .pendu .progress { margin-bottom: 4px; }
      .pendu .consigne { font-size: 0.98rem; margin-bottom: 6px; }
      .pendu-scene { flex-basis: 37%; }
      .pendu-info { flex-basis: 63%; gap: 6px; }
      .pendu-image { width: 62px; height: 62px; font-size: 2.9rem; }
      .pendu-image.is-mystere { font-size: 2.1rem; }
      .pendu-mot { margin-top: 8px; }
      .pendu .feedback { min-height: 2.4em; margin: 2px 0 2px; font-size: 1.02rem; }
      .pendu-touche { min-height: 44px; }
    }
    /* Petits téléphones : les touches gardent au moins 44 px de large. */
    @media (max-width: 365px) {
      .pendu-clavier { --gap: 3px; }
    }
  </style>
</head>
<body>
  <header id="topbar"></header>
  <main id="jeu"></main>
  <script src="../data/lang/en.js"></script>
  <script src="../data/lang/zh.js"></script>
  <script src="../data/lang/de.js"></script>
  <script src="../data/lang/lb.js"></script>
  <script src="../data/lang/fr.js"></script>
  <script src="../js/common.js"></script>
  <script src="pendu.js"></script>
</body>
</html>
