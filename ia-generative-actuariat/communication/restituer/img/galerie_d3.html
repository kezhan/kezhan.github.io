<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphiques D3 pour l'actuariat</title>
<!-- Produit par graphiques_d3/_construire.py depuis _src/ et _donnees.json : ne pas modifier ici. -->
<style>
/* La galerie D3 : charte des sites (navy, crimson, acier), fond clair, une page autonome. */
:root { --navy:#13264A; --crimson:#BA1C3A; --crimson-w:#fbeef1; --steel:#3B547D; --steel-l:#7D92AC; --teal:#1F6F6B;
  --amber:#9A6B1E; --sand:#F7F4F2; --line:#dcd8d4; --ink:#1f2733; --ink-soft:#4a5567; --mute:#78828f; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink); font-size: 14px; line-height: 1.45; }
.gal { padding: 14px 16px 16px; background: #fff; min-height: 100%; }
.tete { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.tete h1 { font: 800 17px Manrope, "Segoe UI", sans-serif; color: var(--navy); margin: 0 0 3px; }
.tete p { color: var(--ink-soft); margin: 0; font-size: 13.5px; }
button { font: 600 12.5px Inter, "Segoe UI", sans-serif; border: 1px solid var(--line); background: #fff; color: var(--navy);
  border-radius: 18px; padding: 5px 13px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--steel-l); }
button.actif { background: var(--navy); border-color: var(--navy); color: #fff; }
.familles { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 0 10px; padding: 10px 12px;
  background: var(--sand); border: 1px solid var(--line); border-radius: 10px; }
.famille { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.famille > span { font: 700 11.5px Manrope, "Segoe UI", sans-serif; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.carte { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px; }
.carte h2 { font: 700 15px Manrope, "Segoe UI", sans-serif; color: var(--navy); margin: 0 0 8px; }
.outils { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 8px; }
.outils .groupe { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.outils .groupe > span { font-size: 12px; color: var(--mute); margin-right: 2px; }
.outils button { padding: 3px 11px; font-size: 12px; }
.outils:empty { display: none; }
.graphe { position: relative; min-height: 200px; }
.graphe svg { display: block; width: 100%; height: auto; overflow: visible; font-family: Inter, "Segoe UI", sans-serif; }
.graphe svg text { fill: var(--ink-soft); font-size: 11px; }
.graphe .axe path, .graphe .axe line { stroke: #c9c4bf; }
.graphe .axe text { fill: var(--mute); font-size: 11px; }
.graphe .grille line { stroke: #efeae5; }
.lecture { color: var(--ink-soft); font-size: 13px; margin: 8px 0 0; }
.pied { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 12px; color: var(--mute); margin-top: 6px; }
.pied a { color: var(--steel); text-decoration: none; border-bottom: 1px solid #c9d2df; }
.pied a:hover { color: var(--crimson); border-color: var(--crimson); }
details.prompt { margin-top: 8px; font-size: 12.5px; }
details.prompt summary { cursor: pointer; color: var(--steel); font-weight: 600; }
details.prompt p { margin: 6px 0 0; padding: 8px 12px; background: var(--sand); border-radius: 8px; color: var(--ink-soft); font-style: italic; }
.infobulle { position: fixed; pointer-events: none; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 4px 14px rgba(19, 38, 74, .12); padding: 7px 10px; font-size: 12px; color: var(--ink); max-width: 280px; display: none; }
.infobulle b { color: var(--navy); }
.infobulle .m { color: var(--mute); }
.fil { font-size: 12px; color: var(--mute); margin: 0 0 6px; }
.fil a { color: var(--steel); cursor: pointer; text-decoration: none; }
.fil a:hover { color: var(--crimson); }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--mute); margin-top: 4px; }
.legende i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
:fullscreen .gal, .gal:fullscreen { overflow: auto; }
@media (max-width: 640px) { .tete { flex-direction: column; } }
</style>
</head>
<body>
<div class="gal">
  <div class="tete">
    <div>
      <h1>Des graphiques D3 pour l'actuariat</h1>
      <p>Chaque graphique a été demandé à l'IA, en D3.js ; les données sont celles des fiches du support et de l'étude ALM de Vision. Choisissez, regardez, survolez.</p>
    </div>
    <button type="button" id="grand">Plein écran</button>
  </div>
  <nav class="familles" id="familles" aria-label="Les graphiques"></nav>
  <section class="carte">
    <h2 id="message"></h2>
    <div class="outils" id="outils"></div>
    <div class="graphe" id="graphe"></div>
    <p class="lecture" id="lecture"></p>
    <div class="pied"><span id="source"></span><a id="fiche" target="_top" hidden></a></div>
    <details class="prompt" id="prompt-bloc"><summary>Le prompt</summary><p id="prompt"></p></details>
  </section>
</div>

/* La galerie : une carte par graphique, choisie par les puces (ou l'ancre #cle de l'adresse).
   Un graphique se déclare dans _src/graphiques/<cle>.js :

   GALERIE.ajouter({
     cle, famille,            // « ALM », « Provisionnement », « IFRS 17 », « Vie », « Tarification »
     titre,                   // le libellé court de la puce
     message,                 // le titre de la carte : la conclusion du graphique, une phrase
     lecture,                 // comment le lire, une ou deux phrases
     source,                  // d'où viennent les données
     fiche: { texte, href },  // la page du support qui va avec (chemin depuis _site/demos/)
     prompt,                  // le prompt qui l'a fait faire à l'IA
     outils: [{ cle, nom, options: [{ v, nom }], defaut }],   // des puces de choix, au-dessus du graphique
     dessiner(el, D, etat)    // dessine dans el (largeur el.clientWidth), D = les données, etat = les choix
   });

   Aides : GALERIE.nb(x, k), GALERIE.meur(x, k) (« 186,6 M€ »), GALERIE.pct(x, k), GALERIE.couleurs,
   GALERIE.bulle(ev, html) et GALERIE.cacher() pour l'infobulle, GALERIE.svg(el, l, h) pour un SVG
   responsive (viewBox) déjà posé dans el. Le graphique se redessine quand la largeur change. */
const GALERIE = (function(){
  "use strict";
  const liste = [];
  const fr = d3.formatLocale({ decimal: ",", thousands: " ", grouping: [3], currency: ["", " €"] });
  const nb = (x, k) => fr.format(`,.${k === undefined ? 0 : k}f`)(x);
  const meur = (x, k) => nb(x, k === undefined ? 1 : k) + " M€";
  const pct = (x, k) => nb(100 * x, k === undefined ? 1 : k) + " %";
  const couleurs = { navy: "#13264A", crimson: "#BA1C3A", steel: "#3B547D", steelL: "#7D92AC", teal: "#1F6F6B", amber: "#9A6B1E",
    sable: "#F7F4F2", ligne: "#dcd8d4", serie: ["#13264A", "#3B547D", "#7D92AC", "#1F6F6B", "#9A6B1E", "#BA1C3A", "#b8c4d4", "#5f7f7c"] };
  let bulleEl = null;
  function bulle(ev, html){
    if(!bulleEl){ bulleEl = document.createElement("div"); bulleEl.className = "infobulle"; document.body.appendChild(bulleEl); }
    bulleEl.innerHTML = html; bulleEl.style.display = "block";
    const l = bulleEl.offsetWidth, h = bulleEl.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if(x + l > window.innerWidth - 8) x = ev.clientX - l - 14;
    if(y + h > window.innerHeight - 8) y = ev.clientY - h - 14;
    bulleEl.style.left = Math.max(4, x) + "px"; bulleEl.style.top = Math.max(4, y) + "px";
  }
  const cacher = () => { if(bulleEl) bulleEl.style.display = "none"; };
  function svg(el, l, h){
    return d3.select(el).append("svg").attr("viewBox", `0 0 ${l} ${h}`).attr("width", l).attr("height", h)
      .attr("preserveAspectRatio", "xMinYMin meet");
  }
  const ajouter = (g) => liste.push(g);

  /* La racine du site, pour les liens vers les fiches : la galerie intégrée à une page est copiée dans
     <page>/img/ (trois niveaux sous la racine) ; celle qu'on télécharge est dans demos/ (un niveau). */
  const RACINE = /\/img\/[^/]*$/.test(location.pathname) ? "../../../" : "../";
  let courant = null, etat = {};
  function puces(){
    const familles = [];
    liste.forEach((g) => { if(!familles.includes(g.famille)) familles.push(g.famille); });
    document.getElementById("familles").innerHTML = familles.map((f) => `<div class="famille"><span>${f}</span>` +
      liste.filter((g) => g.famille === f).map((g) => `<button type="button" data-cle="${g.cle}">${g.titre}</button>`).join("") + "</div>").join("");
  }
  function outils(g){
    const o = document.getElementById("outils");
    o.innerHTML = (g.outils || []).map((x) => `<div class="groupe">${x.nom ? `<span>${x.nom}</span>` : ""}` +
      x.options.map((p) => `<button type="button" data-outil="${x.cle}" data-v="${p.v}" class="${etat[x.cle] === p.v ? "actif" : ""}">${p.nom}</button>`).join("") + "</div>").join("");
  }
  function dessiner(){
    const g = courant, el = document.getElementById("graphe");
    el.innerHTML = ""; cacher();
    try { g.dessiner(el, DONNEES, etat); }
    catch(e){ el.innerHTML = `<p style="color:#BA1C3A">Le graphique n'a pas pu se dessiner : ${e.message}</p>`; throw e; }
  }
  function montrer(cle){
    const g = liste.find((x) => x.cle === cle) || liste[0];
    courant = g; etat = {};
    (g.outils || []).forEach((x) => { etat[x.cle] = x.defaut !== undefined ? x.defaut : x.options[0].v; });
    document.querySelectorAll("#familles button").forEach((b) => b.classList.toggle("actif", b.dataset.cle === g.cle));
    document.getElementById("message").textContent = g.message;
    document.getElementById("lecture").textContent = g.lecture || "";
    document.getElementById("source").textContent = g.source ? "Données : " + g.source : "";
    const f = document.getElementById("fiche");
    if(g.fiche){ f.textContent = g.fiche.texte; f.href = RACINE + g.fiche.href.replace(/^(\.\.\/)+/, ""); f.hidden = false; } else f.hidden = true;
    document.getElementById("prompt").textContent = g.prompt || "";
    document.getElementById("prompt-bloc").hidden = !g.prompt;
    outils(g);
    dessiner();
  }
  function demarrer(){
    puces();
    document.getElementById("familles").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-cle]"); if(!b) return;
      history.replaceState(null, "", "#" + b.dataset.cle); montrer(b.dataset.cle);
    });
    document.getElementById("outils").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-outil]"); if(!b) return;
      etat[b.dataset.outil] = b.dataset.v; outils(courant); dessiner();
    });
    document.getElementById("grand").addEventListener("click", () => {
      const g = document.querySelector(".gal");
      if(document.fullscreenElement) document.exitFullscreen(); else if(g.requestFullscreen) g.requestFullscreen();
    });
    window.addEventListener("hashchange", () => montrer(location.hash.slice(1)));
    let largeur = 0, minuterie = null;
    new ResizeObserver(() => {
      const l = document.getElementById("graphe").clientWidth;
      if(Math.abs(l - largeur) < 2) return; largeur = l;
      clearTimeout(minuterie); minuterie = setTimeout(() => courant && dessiner(), 120);
    }).observe(document.getElementById("graphe"));
    montrer(location.hash.slice(1));
  }
  return { ajouter, demarrer, nb, meur, pct, couleurs, bulle, cacher, svg, liste };
})();
/* Le bilan de l'étude ALM, en icicle zoomable : une rangée par niveau, l'actif à gauche, le passif à droite.
   Actif : catégorie CIC, sous-catégorie, titre (liste des actifs S.06.02). Passif : fonds propres, provisions
   techniques par produit et sous-produit. Données : D.alm.actif, D.alm.passif, D.alm.bilan (moteur de Vision). */
GALERIE.ajouter({
  cle: "bilan_zoom",
  famille: "ALM",
  titre: "Bilan, en zoom",
  get message(){
    const G = GALERIE, b = DONNEES.alm.bilan;
    return `Les obligations font ${G.pct(b.oblig / b.actif)} de l'actif, et les fonds propres ${G.pct(b.fp / b.actif)} du bilan`;
  },
  lecture: "L'actif à gauche, le passif à droite : deux moitiés de même largeur, puisque les fonds propres comblent l'écart. Chaque case a la largeur de sa valeur (de marché à l'actif, actuelle des flux au passif) ; cliquez sur un poste pour l'ouvrir, sur le bandeau du haut ou le fil pour remonter.",
  source: "étude ALM de Vision, bilan au 31/12/2025",
  fiche: { texte: "Projeter, dans le support", href: "../exploration/projeter/index.html" },
  prompt: "« En D3.js, fais-moi un icicle zoomable du bilan de ce tableau : l'actif à gauche et le passif à droite, en deux moitiés de même largeur ; sous l'actif, les catégories CIC, les sous-catégories puis les titres ; sous le passif, les fonds propres et les provisions techniques par produit et sous-produit. La largeur des cases suit les M€ ; dans chaque case, le libellé, le montant et la part du bilan, cachés quand la case est trop petite. Un clic zoome sur le poste avec une transition, un fil d'Ariane permet de remonter, et une infobulle donne le détail au survol. »",
  dessiner(el, D, etat){
    const G = GALERIE, C = G.couleurs, B = D.alm.bilan, total = B.actif;

    // La hiérarchie : Bilan, Actif (catégorie, sous-catégorie, titre), Passif (fonds propres ; provisions, produit, sous-produit)
    const actif = d3.groups(D.alm.actif, (a) => a.categorie, (a) => a.sous).map(([cat, sous]) => ({ nom: cat,
      enfants: sous.map(([s, titres]) => ({ nom: s, enfants: titres.map((t) => ({ nom: t.libelle, valeur: t.valeur, titre: t })) })) }));
    const provisions = d3.groups(D.alm.passif, (p) => p.produit).map(([prod, l]) => ({ nom: prod,
      enfants: l.map((p) => ({ nom: p.sous, valeur: p.valeur, ligne: p })) }));
    const racine = d3.hierarchy({ nom: "Bilan", enfants: [
      { nom: "Actif", enfants: actif },
      { nom: "Passif", enfants: [{ nom: "Fonds propres", valeur: B.fp, fp: true }, { nom: "Provisions techniques", enfants: provisions }] },
    ] }, (d) => d.enfants).sum((d) => (d.enfants ? 0 : d.valeur));
    d3.partition().size([1, 1])(racine);
    const prof = d3.max(racine.leaves(), (n) => n.depth);
    const val = (n) => (n.depth ? n.value : total);              // la racine vaut le total d'un côté, pas la somme des deux
    const chemin = (n) => n.ancestors().reverse().map((a) => a.data.nom).join(" › ");

    // Les couleurs : la rangée Actif / Passif en navy, une teinte par poste en dessous, éclaircie à chaque niveau
    const base = new Map();
    const tonsActif = [C.steel, C.steelL, C.serie[7], C.serie[6]];
    racine.children[0].children.forEach((n, i) => base.set(n, tonsActif[i % tonsActif.length]));
    racine.children[1].children.forEach((n) => base.set(n, n.data.fp ? C.teal : C.amber));
    const couleur = (n) => {
      if(n.depth === 0) return C.ligne;
      if(n.depth === 1) return C.navy;
      const c = base.get(n.ancestors().find((a) => a.depth === 2));
      return d3.interpolateRgb(c, "#fff")(n.depth === 2 ? 0 : n.depth === 3 ? 0.3 : 0.5);
    };
    const lum = (c) => { const r = d3.rgb(c), f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      return 0.2126 * f(r.r) + 0.7152 * f(r.g) + 0.0722 * f(r.b); };
    const encre = (n) => { const L = lum(couleur(n)); return (L + 0.05) / (lum(C.navy) + 0.05) > 1.05 / (L + 0.05) ? C.navy : "#fff"; };

    // La mesure des textes, pour n'écrire que ce qui tient dans la case
    const ctx = document.createElement("canvas").getContext("2d");
    const larg = (t, px, gras) => { ctx.font = `${gras ? 600 : 400} ${px}px Inter, "Segoe UI", sans-serif`; return ctx.measureText(t).width; };
    function couper(texte, w, px, gras, max){
      const lignes = []; let cur = "";
      texte.split(/\s+/).forEach((m) => { const e = cur ? cur + " " + m : m; if(larg(e, px, gras) <= w) cur = e; else { if(cur) lignes.push(cur); cur = m; } });
      if(cur) lignes.push(cur);
      return lignes.length <= max && lignes.every((l) => larg(l, px, gras) <= w) ? lignes : null;
    }

    // Le fil d'Ariane, puis le SVG
    const fil = d3.select(el).append("div").attr("class", "fil");
    const L = Math.max(320, el.clientWidth), H = 430, hf = 34, pad = 6;
    const svg = G.svg(el, L, H);
    svg.append("clipPath").attr("id", "bz-cadre").append("rect").attr("width", L).attr("height", H);
    const zone = svg.append("g").attr("clip-path", "url(#bz-cadre)");
    const noeuds = zone.selectAll("g.n").data(racine.descendants()).join("g").attr("class", "n");
    noeuds.append("rect").attr("fill", couleur).attr("rx", 2);
    const etiq = noeuds.append("text").style("pointer-events", "none");
    const monter = svg.append("text").attr("x", L - 10).attr("y", hf / 2).attr("dy", "0.35em").attr("text-anchor", "end")
      .style("font-size", "11.5px").style("font-weight", 600).style("cursor", "pointer");

    let focus = racine;
    // Les rangées sous le bandeau : la plus profonde, celle des cases étroites, a plus de hauteur pour ses libellés
    const poids = (d) => (d === prof ? 1.6 : 1);
    const geo = (n) => {
      const f = focus, k = f.x1 - f.x0, rangs = d3.range(f.depth + 1, prof + 1);
      const hr = rangs.length ? (H - hf) / d3.sum(rangs, poids) : 0;
      const haut = (d) => (d < f.depth ? -(f.depth - d) * hf : d === f.depth ? 0 : hf + hr * d3.sum(d3.range(f.depth + 1, d), poids));
      const y0 = haut(n.depth), y1 = n.depth <= f.depth ? y0 + hf : n.children ? haut(n.depth + 1) : H;
      return { x: (n.x0 - f.x0) / k * L, y: y0, w: (n.x1 - n.x0) / k * L, h: y1 - y0 };
    };
    const visible = (n) => n === focus || (n.depth > focus.depth && n.ancestors().includes(focus));
    // Le clic : le bandeau remonte d'un niveau ; une case ouvre le premier poste, elle ou un ancêtre, qui a plusieurs titres
    // (ouvrir un poste à un seul titre ne montrerait qu'une grande case vide)
    const action = (n) => {
      if(n === focus) return n.parent;
      let a = n;
      while(a.parent && a.leaves().length < 2) a = a.parent;
      return a !== focus && a.depth > focus.depth ? a : null;
    };

    // Un libellé : le nom coupé en lignes, puis le montant et la part s'il reste de la place ; null si le nom ne tient pas
    function disposer(n, w, h, px, lh){
      const somme = G.meur(val(n)), part = G.pct(val(n) / total);
      const noms = couper(n.data.nom, w, px, true, Math.floor(h / lh));
      if(!noms) return null;
      const reste = h - noms.length * lh, lignes = noms.map((s) => ({ s, gras: true }));
      if(reste >= lh && larg(`${somme} · ${part}`, 11, false) <= w) lignes.push({ s: `${somme} · ${part}` });
      else if(reste >= 2 * lh && larg(somme, 11, false) <= w) lignes.push({ s: somme }, { s: part });
      else if(reste >= lh && larg(somme, 11, false) <= w) lignes.push({ s: somme });
      return lignes;
    }
    function ecrire(n, g){
      const t = d3.select(this).text(null).attr("x", null).attr("y", null).attr("dy", null).attr("transform", null);
      if(!visible(n) || g.w < 18) return;
      const fill = encre(n);
      if(n === focus){
        // Le bandeau du haut : une ligne, nom puis montant
        const somme = G.meur(val(n)), suite = n.depth ? `${somme} · ${G.pct(val(n) / total)} du bilan` : `${somme} à l'actif comme au passif`;
        if(larg(n.data.nom + "  " + suite, 12.5, true) > g.w - 2 * pad - 130) return;
        t.attr("x", pad + 2).attr("y", hf / 2).attr("dy", "0.35em").style("fill", fill);
        t.append("tspan").style("font-weight", 700).style("font-size", "12.5px").style("fill", fill).text(n.data.nom);
        t.append("tspan").attr("dx", 8).style("font-size", "12px").style("fill", fill).style("opacity", 0.85).text(suite);
        return;
      }
      const ligne = (l, px) => t.append("tspan").style("font-size", l.gras ? px + "px" : "11px").style("font-weight", l.gras ? 600 : 400)
        .style("fill", fill).style("opacity", l.gras ? 1 : 0.85).text(l.s);
      // À l'horizontale d'abord ; une case étroite et haute écrit son libellé à la verticale, de bas en haut
      const lignes = disposer(n, g.w - 2 * pad, g.h - 2 * pad, 12, 14);
      if(lignes){ lignes.forEach((l, i) => ligne(l, 12).attr("x", pad).attr("y", pad + 11 + i * 14)); return; }
      const vert = disposer(n, g.h - 2 * pad, g.w - 4, 11.5, 13);
      if(!vert) return;
      const bloc = (vert.length - 1) * 13;
      t.attr("transform", `translate(${g.w / 2 - bloc / 2 + 3},${g.h - pad}) rotate(-90)`);
      vert.forEach((l, i) => ligne(l, 11.5).attr("x", 0).attr("y", i * 13));
    }

    function zoomer(f, anime){
      focus = f; etat.zoom = chemin(f);
      // Le fil : chaque ancêtre est un lien
      const anc = f.ancestors().reverse();
      fil.html(anc.map((a, i) => (i < anc.length - 1 ? `<a data-i="${i}">${a.data.nom}</a>` : `<span style="color:${C.navy};font-weight:600">${a.data.nom}</span>`)).join(" › ")
        + (f.parent ? "" : ` <span>· cliquez sur un poste pour l'ouvrir</span>`));
      fil.selectAll("a").on("click", function(){ zoomer(anc[+this.dataset.i], true); });
      noeuds.each(function(n){ n.g = geo(n); });
      const tr = (s) => (anime ? s.transition().duration(650).ease(d3.easeCubicInOut) : s);
      tr(noeuds).attr("transform", (n) => `translate(${n.g.x},${n.g.y})`);
      tr(noeuds.select("rect")).attr("width", (n) => Math.max(0, n.g.w - 1)).attr("height", (n) => Math.max(0, n.g.h - 1));
      noeuds.style("cursor", (n) => (action(n) && visible(n) ? "pointer" : "default"));
      etiq.interrupt().attr("opacity", 0).each(function(n){ ecrire.call(this, n, n.g); })
        .transition().delay(anime ? 560 : 0).duration(anime ? 220 : 0).attr("opacity", 1);
      monter.interrupt().attr("opacity", 0).text(f.parent ? `↑ ${f.parent.data.nom}` : "").style("fill", encre(f))
        .transition().delay(anime ? 560 : 0).duration(anime ? 220 : 0).attr("opacity", 1);
    }

    noeuds.on("click", (ev, n) => { const a = action(n); if(a && visible(n)) { G.cacher(); zoomer(a, true); } })
      .on("mousemove", (ev, n) => {
        if(!visible(n)) return;
        const d = n.data, a = action(n);
        let html = `<b>${d.nom}</b>`;
        if(n.depth > 1) html += `<br><span class="m">${n.ancestors().reverse().slice(1, -1).map((x) => x.data.nom).join(" › ")}</span>`;
        html += `<br>${G.meur(val(n))}, ${G.pct(val(n) / total)} du bilan`;
        if(n.depth > 1) html += `<br>${G.pct(n.value / n.parent.value)} du poste « ${n.parent.data.nom} »`;
        if(d.titre) html += `<br><span class="m">CIC ${d.titre.cic}` + (d.titre.nominal ? `, nominal ${G.meur(d.titre.nominal, 0)}` : "")
          + (d.titre.maturite ? `, échéance ${G.nb(d.titre.maturite)} ans` : "") + "</span>";
        if(d.ligne) html += `<br><span class="m">PM ${G.meur(d.ligne.pm, 0)}, taux garanti ${G.nb(d.ligne.garanti, 1)} %</span>`;
        if(d.fp) html += `<br><span class="m">Actif ${G.meur(B.actif)} moins provisions ${G.meur(B.passif)}</span>`;
        if(a) html += `<br><span class="m">${n === focus ? "Cliquez pour remonter" : a === n ? "Cliquez pour ouvrir" : `Cliquez pour ouvrir « ${a.data.nom} »`}</span>`;
        G.bulle(ev, html);
      })
      .on("mouseleave", G.cacher);
    monter.on("click", () => { if(focus.parent) zoomer(focus.parent, true); });

    // Le zoom survit au redimensionnement : on repart du poste ouvert
    zoomer(racine.descendants().find((n) => chemin(n) === etat.zoom) || racine, false);
  },
});
/* Le bilan de l'étude ALM, en Sankey : l'actif se rassemble dans le bilan, qui s'éclate en fonds propres et en
   provisions techniques, puis par produit et sous-produit. Largeur des flux = M€.
   Données : D.alm.actif (liste des actifs S.06.02), D.alm.passif, D.alm.bilan (moteur de Vision). */
GALERIE.ajouter({
  cle: "bilan_sankey",
  famille: "ALM",
  titre: "Bilan, en Sankey",
  get message(){
    const G = GALERIE, b = DONNEES.alm.bilan;
    return `Les ${G.meur(b.actif)} d'actif couvrent ${G.meur(b.passif)} de provisions et laissent ${G.meur(b.fp)} de fonds propres`;
  },
  lecture: "La largeur d'un flux est son montant en M€ : l'actif, à gauche, se rassemble dans le bilan, qui se partage à droite entre fonds propres et provisions techniques, puis entre produits. Survolez un nœud pour isoler ses flux ; « Détail » descend jusqu'aux titres et aux sous-produits.",
  source: "étude ALM de Vision, bilan au 31/12/2025",
  fiche: { texte: "Projeter, dans le support", href: "../exploration/projeter/index.html" },
  prompt: "« En D3.js avec d3-sankey, fais-moi un diagramme de Sankey du bilan de ce tableau : à gauche les actifs par catégorie CIC, au milieu le bilan, à droite le passif, avec les fonds propres d'un côté et les provisions techniques éclatées par produit. La largeur des flux suit les M€. Ajoute un bouton pour passer au détail (les titres à gauche, les sous-produits à droite), le nom, le montant et la part du bilan à côté de chaque nœud, et une infobulle sur les nœuds et les flux. »",

    const teinte = (c, t) => d3.interpolateRgb(c, "#fff")(t);

    // Les nœuds, colonne par colonne, et les flux ; une couleur par catégorie d'actif, teal pour les fonds propres, ambre pour les provisions
    const noeuds = [], liens = [];
    const n = (id, nom, col, couleur, info) => noeuds.push({ id, nom, col, couleur, info: info || {} });
    const l = (source, target, value, couleur) => liens.push({ source, target, value, couleur });
    const c0 = detail ? 1 : 0;                                       // la colonne des catégories
    const tons = [C.steel, C.steelL, C.serie[7], C.serie[6]];
    const cats = d3.groups(D.alm.actif, (a) => a.categorie);
    if(detail) cats.forEach(([cat, titres], i) => titres.forEach((t) => {
      n("t:" + t.id, t.libelle, 0, tons[i % tons.length], { titre: t });
      l("t:" + t.id, "c:" + cat, t.valeur, tons[i % tons.length]);
    }));
    cats.forEach(([cat, titres], i) => {
      n("c:" + cat, cat, c0, tons[i % tons.length], { sous: [...new Set(titres.map((t) => t.sous))] });
      l("c:" + cat, "bilan", d3.sum(titres, (t) => t.valeur), tons[i % tons.length]);
    });
    n("bilan", "Bilan", c0 + 1, C.navy);
    n("fp", "Fonds propres", c0 + 2, C.teal, { fp: true });
    n("pt", "Provisions techniques", c0 + 2, C.amber);
    l("bilan", "fp", B.fp, C.teal);
    l("bilan", "pt", d3.sum(D.alm.passif, (p) => p.valeur), C.amber);
    d3.groups(D.alm.passif, (p) => p.produit).forEach(([prod, lignes]) => {
      n("p:" + prod, prod, c0 + 3, teinte(C.amber, 0.25));
      l("pt", "p:" + prod, d3.sum(lignes, (p) => p.valeur), C.amber);
      if(detail) lignes.forEach((p) => {
        n("s:" + p.id, p.sous, c0 + 4, teinte(C.amber, 0.45), { ligne: p });
        l("p:" + prod, "s:" + p.id, p.valeur, teinte(C.amber, 0.25));
      });
    });
    const ncol = c0 + (detail ? 5 : 4);

    // La mesure des libellés : les marges gauche et droite, et la largeur permise entre deux colonnes
    const ctx = document.createElement("canvas").getContext("2d");
    const larg = (t, px, gras) => { ctx.font = `${gras ? 600 : 400} ${px}px Inter, "Segoe UI", sans-serif`; return ctx.measureText(t).width; };
    const somme = (d) => G.meur(d.value), part = (d) => G.pct(d.value / total);
    const valeurs = noeuds.reduce((m, x) => m.set(x.id, 0), new Map());

    const L = Math.max(320, el.clientWidth), H = 440, nw = 14;

    const graphe = sankey({ nodes: noeuds.map((d) => Object.assign({}, d)), links: liens.map((d) => Object.assign({}, d)) });

          .map(([x, nom]) => `${G.pct(x)} de « ${nom} »`);
        G.bulle(ev, `<b>${d.source.nom}</b> → <b>${d.target.nom}</b><br>${G.meur(d.value)}, ${G.pct(d.value / total)} du bilan` +
          (parts.length ? `<br><span class="m">${parts.join(", ")}</span>` : ""));

      .on("mouseleave", function(){ d3.select(this).attr("stroke-opacity", 0.42); G.cacher(); });

    const gn = svg.append("g").selectAll("rect").data(graphe.nodes).join("rect")
      .attr("x", (d) => d.x0).attr("y", (d) => d.y0).attr("width", (d) => d.x1 - d.x0).attr("height", (d) => Math.max(1, d.y1 - d.y0))
      .attr("fill", (d) => d.couleur).attr("rx", 2)
      .on("mousemove", (ev, d) => {
        flux.attr("stroke-opacity", (k) => (k.source === d || k.target === d ? 0.7 : 0.12));
        const i = d.info;
        let html = `<b>${d.nom}</b><br>${somme(d)}, ${part(d)} du bilan`;

        if(d.id.startsWith("p:") || d.id.startsWith("s:")) html += `<br>${G.pct(d.value / B.passif)} des provisions techniques`;
        if(i.fp) html += `<br><span class="m">Actif ${G.meur(B.actif)} moins provisions ${G.meur(B.passif)}</span>`;

        if(i.titre) html += `<br><span class="m">${i.titre.categorie}, CIC ${i.titre.cic}` + (i.titre.nominal ? `, nominal ${G.meur(i.titre.nominal, 0)}` : "")
          + (i.titre.maturite ? `, échéance ${G.nb(i.titre.maturite)} ans` : "") + "</span>";
        if(i.ligne) html += `<br><span class="m">PM ${G.meur(i.ligne.pm, 0)}, taux garanti ${G.nb(i.ligne.garanti, 1)} %</span>`;
        G.bulle(ev, html);
      })
      .on("mouseleave", () => { flux.attr("stroke-opacity", 0.42); G.cacher(); });

    // Les libellés : à gauche de la première colonne, à droite des autres ; entre deux colonnes, coupés à la largeur permise
    function couper(texte, w, px, gras){
      const lignes = []; let cur = "";
      texte.split(/\s+/).forEach((m) => { const e = cur ? cur + " " + m : m; if(larg(e, px, gras) <= w || !cur) cur = e; else { lignes.push(cur); cur = m; } });
      if(cur) lignes.push(cur);
      return lignes;
    }
    const etiquettes = graphe.nodes.map((d) => {
      const bord = d.layer === ncol - 1 || d.layer === 0, w = bord ? (d.layer === 0 ? mg : md) - 8 : kx - nw - 10;
      const noms = bord ? [d.nom] : couper(d.nom, w, 11.5, true);
      const v = `${somme(d)} · ${part(d)}`;
      const vals = larg(v, 11, false) <= w ? [v] : larg(somme(d), 11, false) <= w ? [somme(d), part(d)] : [];
      return { d, noms, vals, h: 13.5 * (noms.length + vals.length), y: (d.y0 + d.y1) / 2 };
    });
    // Pas de chevauchement dans une colonne : on pousse vers le bas, puis vers le haut si l'on sort du cadre
    d3.groups(etiquettes, (e) => e.d.layer).forEach(([, col]) => {
      col.sort((a, b) => a.y - b.y);
      let bas = -Infinity;
      col.forEach((e) => { e.top = Math.max(e.y - e.h / 2, bas + 3); bas = e.top + e.h; });
      let haut = H;
      col.slice().reverse().forEach((e) => { e.top = Math.max(0, Math.min(e.top, haut - 3 - e.h)); haut = e.top; });
    });
    const gt = svg.append("g").style("pointer-events", "none");
    etiquettes.forEach((e) => {
      const gauche = e.d.layer === 0, x = gauche ? e.d.x0 - 6 : e.d.x1 + 6;
      const t = gt.append("text").attr("text-anchor", gauche ? "end" : "start")
        .style("paint-order", "stroke").style("stroke", "#fff").style("stroke-width", "3px").style("stroke-linejoin", "round");
      e.noms.forEach((s, i) => t.append("tspan").attr("x", x).attr("y", e.top + 10.5 + i * 13.5)
        .style("font-size", "11.5px").style("font-weight", 600).style("fill", C.navy).text(s));

        .style("font-size", "11px").text(s));
    });
  },
});

    svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", m.h - 4).attr("y2", H - m.b).attr("stroke", G.couleurs.navy);
    const g = svg.selectAll("g.ligne").data(lignes).join("g").attr("class", "ligne");
    g.append("rect").attr("x", (d) => x(Math.min(0, d.v))).attr("y", (d) => y(d.s.nom)).attr("height", y.bandwidth())

      .on("mousemove", (ev, d) => G.bulle(ev, `<b>${d.s.nom}</b> <span class="m">${d.s.note}</span><br>Fonds propres ${G.meur(d.s.fp)}` +
        `<br>Couverture du passif ${G.pct(d.s.couverture)}<br>Écart de duration ${G.nb(d.s.gap, 1)} an`))

      .attr("text-anchor", "end").style("font-size", "12px").style("fill", G.couleurs.navy).text((d) => d.s.nom);
    // L'écart au bout de la barre ; dans la barre, en blanc, quand elle touche le bord gauche
    const dedans = (d) => d.v < 0 && x(d.v) - m.g < 64;
    g.append("text").attr("x", (d) => dedans(d) ? x(d.v) + 6 : x(d.v) + (d.v < 0 ? -6 : 6))

      .attr("text-anchor", (d) => dedans(d) || d.v >= 0 ? "start" : "end").style("font-size", "11.5px").style("font-weight", 600)
      .style("fill", (d) => dedans(d) ? "#fff" : d.v < 0 ? G.couleurs.crimson : G.couleurs.teal).text((d) => fmt(d.v));
  },
});

   Données : D.alm.orsa (FA_PR_ESG.resultat, puis eventail et chiffres : le moteur de Vision, rejoué par _extraire.py).

(function(){

    outils: [{ cle: "mesure", nom: "Mesure", options: [{ v: "fp", nom: "Fonds propres" }, { v: "couv", nom: "Couverture du passif" },

    dessiner(el, D, etat){

      const fourchette = (a, b) => `${G.nb(100 * qs[a], dec(qs[a]))} à ${G.pct(qs[b], dec(qs[b]))}`;

        .on("pointermove", (ev) => {

      const an = front.append("text").attr("x", 5).attr("y", m.h + 12).style("font-size", "12px").style("font-weight", 700)
        .style("fill", C.crimson).style("stroke", "#fff").style("stroke-width", 3).style("paint-order", "stroke");
      bouton.on("click", () => {

/* Le triangle de liquidation de la fiche R1 : années d'origine en lignes, développement en colonnes,
   l'observé au-dessus de l'escalier, la projection chain ladder en dessous (plus claire, hachurée, en italique).
   Données : D.triangle (Taylor et Ashe 1983, cumulés observés puis projetés par chain ladder). */
(function(){
  "use strict";
  // Le chain ladder relu sur les données : facteurs, dernier observé, ultimes et réserves
  function calculer(T){
    const n = T.n, C = T.cumule, O = T.observe;
    const dernier = C.map((r, i) => d3.max(d3.range(n).filter((j) => O[i][j])));
    const f = d3.range(n - 1).map((j) => {
      let a = 0, b = 0, k = 0;
      for(let i = 0; i < n; i++) if(O[i][j] && O[i][j + 1]){ a += C[i][j + 1]; b += C[i][j]; k++; }
      return { f: a / b, k };
    });
    const ultime = C.map((r) => r[n - 1]);
    const reserve = C.map((r, i) => r[n - 1] - r[dernier[i]]);
    return { n, C, O, dernier, f, ultime, reserve, totU: d3.sum(ultime), totR: d3.sum(reserve) };
  }

  GALERIE.ajouter({
    cle: "triangle",
    famille: "Provisionnement",
    titre: "Triangle",
    get message(){
      const G = GALERIE, K = calculer(DONNEES.triangle), r = K.reserve[K.n - 1];
      return `La réserve chain ladder est de ${G.nb(K.totR)} pour un ultime de ${G.nb(K.totU)}, et la dernière année d'origine en porte ${G.pct(r / K.totR)}`;
    },
    lecture: "Chaque ligne est une année d'origine, chaque colonne une année de développement : au-dessus de l'escalier l'observé, en dessous la projection chain ladder, plus claire et en italique. Survolez une case : sa diagonale calendaire s'allume, c'est là que se lisent les effets d'une année comptable (inflation, changement de gestion).",
    get source(){ return DONNEES.triangle.source + ", unités non monétaires"; },
    fiche: { texte: "Fiche R1, chain ladder", href: "../bibliotheque/R1/index.html" },
    prompt: "« En D3.js, trace ce triangle de liquidation en carte de couleurs : années d'origine en lignes, développement en colonnes, l'observé en couleur pleine, la partie projetée par chain ladder plus claire, hachurée, avec les valeurs en italique, et les montants écrits dans les cases. Trois vues : cumulés, incréments, facteurs individuels. Au survol d'une case : son détail, le facteur chain ladder de sa colonne, et sa diagonale calendaire surlignée. À droite, la réserve de chaque année d'origine et le total. »",
    outils: [{ cle: "vue", nom: "Vue", options: [{ v: "cumule", nom: "Cumulés" }, { v: "increment", nom: "Incréments" }, { v: "facteur", nom: "Facteurs individuels" }], defaut: "cumule" }],
    dessiner(el, D, etat){
      const G = GALERIE, c = G.couleurs, K = calculer(D.triangle), n = K.n;
      const vue = etat.vue, fac = vue === "facteur", nc = fac ? n - 1 : n;
      const fmtF = (x) => G.nb(x, 3);

      // Une case par cellule de la vue : sa valeur, observée ou projetée, et sa diagonale calendaire
      const cases = [];
      for(let i = 0; i < n; i++) for(let j = 0; j < nc; j++){
        let v, obs;
        if(vue === "cumule"){ v = K.C[i][j]; obs = K.O[i][j]; }
        else if(vue === "increment"){ v = K.C[i][j] - (j ? K.C[i][j - 1] : 0); obs = K.O[i][j]; }
        else { v = K.C[i][j + 1] / K.C[i][j]; obs = K.O[i][j + 1]; }
        cases.push({ i, j, v, obs, cal: i + j + (fac ? 2 : 1) });
      }

      // Géométrie : étiquettes à gauche, la grille, la colonne des réserves à droite
      const L = Math.max(360, el.clientWidth);
      const m = { g: 78, h: 40 }, rc = Math.round(Math.min(130, Math.max(104, L * 0.11))), ecart = 14;
      const cw = (L - m.g - rc - ecart) / nc, rh = 30;
      const X = (j) => m.g + j * cw, Y = (i) => m.h + i * rh;
      const yF = Y(n) + 20, yLeg = yF + 32, H = yLeg + 22;
      const svg = G.svg(el, L, H);

      // Couleurs : séquentielle pour les montants, divergente pour l'écart au facteur de la colonne
      let couleur, leg;
      if(fac){
        const e = d3.max(cases.filter((d) => d.obs), (d) => Math.abs(Math.log(d.v / K.f[d.j].f)));
        const s = d3.scaleDiverging([-e, 0, e], d3.piecewise(d3.interpolateRgb, [c.steel, "#efebe7", c.crimson]));
        couleur = (d) => s(Math.log(d.v / K.f[d.j].f));
        leg = { s, gauche: "−" + G.pct(1 - Math.exp(-e), 0), droite: "+" + G.pct(Math.exp(e) - 1, 0), titre: "Écart au facteur de la colonne", lin: (t) => -e + 2 * e * t };
      } else {
        const max = d3.max(cases, (d) => d.v);
        const s = d3.scaleSequential([0, max], d3.piecewise(d3.interpolateRgb, ["#f3f0ec", "#c9d2df", c.steelL, c.steel, c.navy]));
        couleur = (d) => s(d.v);
        leg = { s, gauche: "0", droite: G.nb(max), titre: vue === "cumule" ? "Montant cumulé" : "Incrément", lin: (t) => max * t };
      }
      const remplir = (d) => d.obs ? couleur(d) : d3.interpolateRgb(couleur(d), "#fff")(0.5);
      const encre = (d) => d3.lab(remplir(d)).l < 58 ? "#fff" : d.obs ? c.navy : c.steel;

      const defs = svg.append("defs");
      defs.append("pattern").attr("id", "tri-hachure").attr("patternUnits", "userSpaceOnUse").attr("width", 6).attr("height", 6)
        .append("path").attr("d", "M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2").attr("stroke", c.navy).attr("stroke-opacity", 0.13).attr("stroke-width", 1);
      const grad = defs.append("linearGradient").attr("id", "tri-degrade");
      d3.range(11).forEach((k) => grad.append("stop").attr("offset", k / 10).attr("stop-color", leg.s(leg.lin(k / 10))));

      // En-têtes
      svg.append("text").attr("x", X(0) + (nc * cw) / 2).attr("y", 13).attr("text-anchor", "middle").style("font-size", "11.5px")
        .style("fill", c.navy).style("font-weight", 600).text(fac ? "Facteur individuel, de la colonne j à j + 1" : "Année de développement");
      svg.selectAll("text.col").data(d3.range(nc)).join("text").attr("class", "col").attr("x", (j) => X(j) + cw / 2).attr("y", m.h - 8)
        .attr("text-anchor", "middle").style("font-size", "11px").text((j) => fac ? `${j + 1}→${j + 2}` : j + 1);
      svg.selectAll("text.lig").data(d3.range(n)).join("text").attr("class", "lig").attr("x", m.g - 10).attr("y", (i) => Y(i) + rh / 2)
        .attr("dy", "0.35em").attr("text-anchor", "end").style("font-size", "11.5px").style("fill", c.navy).text((i) => i + 1);
      svg.append("text").attr("transform", `translate(16,${Y(0) + (n * rh) / 2}) rotate(-90)`).attr("text-anchor", "middle")
        .style("font-size", "11.5px").style("fill", c.navy).style("font-weight", 600).text("Année d'origine");

      // Les cases
      const gc = svg.append("g").selectAll("g.case").data(cases).join("g").attr("class", "case").style("cursor", "default");
      gc.append("rect").attr("x", (d) => X(d.j) + 1).attr("y", (d) => Y(d.i) + 1).attr("width", cw - 2).attr("height", rh - 2)
        .attr("rx", 2).attr("fill", remplir);
      gc.filter((d) => !d.obs).append("rect").attr("x", (d) => X(d.j) + 1).attr("y", (d) => Y(d.i) + 1).attr("width", cw - 2)
        .attr("height", rh - 2).attr("rx", 2).attr("fill", "url(#tri-hachure)");
      gc.append("text").attr("x", (d) => X(d.j) + cw / 2).attr("y", (d) => Y(d.i) + rh / 2).attr("dy", "0.35em").attr("text-anchor", "middle")
        .style("font-size", "11px").style("font-style", (d) => d.obs ? "normal" : "italic").style("font-weight", (d) => d.obs ? 600 : 400)
        .style("fill", encre).text((d) => fac ? fmtF(d.v) : G.nb(d.v))
        .each(function(){ if(this.getComputedTextLength() > cw - 6) this.remove(); });

      // L'escalier entre l'observé et le projeté
      const nObs = d3.range(n).map((i) => cases.filter((d) => d.i === i && d.obs).length);
      let p = `M${X(nObs[0])},${Y(0)}`;
      for(let i = 0; i < n; i++){ p += `V${Y(i + 1)}`; if(i + 1 < n) p += `H${X(nObs[i + 1])}`; }
      svg.append("path").attr("d", p).attr("fill", "none").attr("stroke", c.navy).attr("stroke-width", 2).attr("pointer-events", "none");

      // Les facteurs chain ladder : entre les colonnes (cumulés, incréments) ou sous chaque colonne (facteurs)
      svg.append("text").attr("x", m.g - 10).attr("y", yF).attr("dy", "0.35em").attr("text-anchor", "end")
        .style("font-size", "11px").style("fill", c.navy).style("font-weight", 600).text("Chain ladder");
      svg.selectAll("text.fcl").data(K.f).join("text").attr("class", "fcl")
        .attr("x", (d, j) => fac ? X(j) + cw / 2 : X(j + 1)).attr("y", yF).attr("dy", "0.35em").attr("text-anchor", "middle")
        .style("font-size", "11px").style("fill", c.navy).text((d) => (fac || cw < 50 ? "" : "×") + fmtF(d.f));

      // La réserve de chaque année d'origine, et le total
      const xr = X(nc) + ecart, rmax = d3.max(K.reserve);
      svg.append("text").attr("x", L - 4).attr("y", m.h - 8).attr("text-anchor", "end").style("font-size", "11px")
        .style("fill", c.navy).style("font-weight", 600).text("Réserve");
      svg.selectAll("rect.res").data(K.reserve).join("rect").attr("class", "res").attr("x", xr).attr("y", (d, i) => Y(i) + 6)
        .attr("height", rh - 12).attr("width", (d) => (rc - 4) * d / rmax).attr("rx", 2).attr("fill", "#e3e8ef");
      svg.selectAll("text.res").data(K.reserve).join("text").attr("class", "res").attr("x", L - 4).attr("y", (d, i) => Y(i) + rh / 2)
        .attr("dy", "0.35em").attr("text-anchor", "end").style("font-size", "11px").style("fill", c.navy).text((d) => G.nb(d));
      svg.append("line").attr("x1", xr).attr("x2", L - 2).attr("y1", yF - 12).attr("y2", yF - 12).attr("stroke", c.steelL);
      svg.append("text").attr("x", xr).attr("y", yF).attr("dy", "0.35em").style("font-size", "11px").text("Total");
      svg.append("text").attr("x", L - 4).attr("y", yF).attr("dy", "0.35em").attr("text-anchor", "end").style("font-size", "11.5px")
        .style("fill", c.navy).style("font-weight", 700).text(G.nb(K.totR));

      // Légende : l'échelle de couleur, puis observé et projeté
      const lg = svg.append("g").attr("transform", `translate(${m.g},${yLeg})`);
      const t1 = lg.append("text").attr("y", 4).attr("dy", "0.35em").style("font-size", "11px").text(leg.titre);
      let xl = t1.node().getComputedTextLength() + 10;
      const t2 = lg.append("text").attr("x", xl).attr("y", 4).attr("dy", "0.35em").style("font-size", "11px").text(leg.gauche);
      xl += t2.node().getComputedTextLength() + 6;
      lg.append("rect").attr("x", xl).attr("y", -1).attr("width", 120).attr("height", 10).attr("rx", 2).attr("fill", "url(#tri-degrade)");
      xl += 126;
      const t3 = lg.append("text").attr("x", xl).attr("y", 4).attr("dy", "0.35em").style("font-size", "11px").text(leg.droite);
      xl += t3.node().getComputedTextLength() + 24;
      const cle = (x, obs, txt) => {
        lg.append("rect").attr("x", x).attr("y", -3).attr("width", 22).attr("height", 14).attr("rx", 2)
          .attr("fill", obs ? c.steelL : d3.interpolateRgb(c.steelL, "#fff")(0.5));
        if(!obs) lg.append("rect").attr("x", x).attr("y", -3).attr("width", 22).attr("height", 14).attr("rx", 2).attr("fill", "url(#tri-hachure)");
        const t = lg.append("text").attr("x", x + 28).attr("y", 4).attr("dy", "0.35em").style("font-size", "11px")
          .style("font-style", obs ? "normal" : "italic").text(txt);
        return x + 28 + t.node().getComputedTextLength() + 16;
      };
      if(m.g + xl + 330 < L){ xl = cle(xl, true, "observé"); cle(xl, false, "projeté par chain ladder"); }

      // Survol : le détail de la case, le facteur de sa colonne, et sa diagonale calendaire
      const surligne = svg.append("g").attr("pointer-events", "none");
      const cal = (k) => `Diagonale calendaire ${k}` + (k > n ? ", à venir" : "");
      gc.on("mouseenter", (ev, d) => {
        gc.attr("opacity", (e) => e.cal === d.cal ? 1 : 0.32);
        surligne.selectAll("rect").data(cases.filter((e) => e.cal === d.cal)).join("rect")
          .attr("x", (e) => X(e.j) + 1).attr("y", (e) => Y(e.i) + 1).attr("width", cw - 2).attr("height", rh - 2).attr("rx", 2)
          .attr("fill", "none").attr("stroke", (e) => e === d ? c.navy : c.crimson).attr("stroke-width", (e) => e === d ? 2.5 : 1.6);
      }).on("mousemove", (ev, d) => {
        const i = d.i, j = d.j, etat0 = d.obs ? "observé" : "projeté par chain ladder";
        let h = `<b>Origine ${i + 1}, ${fac ? `facteur ${j + 1}→${j + 2}` : `développement ${j + 1}`}</b> <span class="m">${etat0}</span><br>`;
        if(vue === "cumule"){
          h += `Cumulé ${G.nb(d.v)}`;
          if(!d.obs) h += `<br><span class="m">≈ ${G.nb(K.C[i][j - 1])} × ${fmtF(K.f[j - 1].f)}, facteur ${j}→${j + 1}</span>`;
        } else if(vue === "increment"){
          h += `Incrément ${G.nb(d.v)}` + (j ? `<br><span class="m">= ${G.nb(K.C[i][j])} − ${G.nb(K.C[i][j - 1])}</span>` : "");
        } else {
          h += `Facteur individuel ${fmtF(d.v)}<br><span class="m">= ${G.nb(K.C[i][j + 1])} / ${G.nb(K.C[i][j])}</span>`;
          if(d.obs) h += `<br>Écart au facteur de la colonne ${d.v >= K.f[j].f ? "+" : "−"}${G.pct(Math.abs(d.v / K.f[j].f - 1))}`;
        }
        h += j < n - 1 ? `<br>Facteur chain ladder ${j + 1}→${j + 2} : <b>${fmtF(K.f[j].f)}</b> <span class="m">(sur ${K.f[j].k} ligne${K.f[j].k > 1 ? "s" : ""})</span>`
          : `<br><span class="m">Dernière colonne : pas de facteur au-delà</span>`;
        h += `<br>${cal(d.cal)}`;
        G.bulle(ev, h);
      }).on("mouseleave", () => { gc.attr("opacity", 1); surligne.selectAll("*").remove(); G.cacher(); });
    },
  });
})();
/* La cascade de la CSM de la fiche S3 : la CSM initiale, plus l'accrétion au taux verrouillé, moins la
   libération de chaque année en résultat, jusqu'à zéro. Deux lectures : sur toute la durée, année par année.
   Données : D.csm (temporaire décès, libération au prorata des unités de couverture). */
(function(){
  "use strict";
  const M = 1e6;
  const duree = (S) => { const k = S.fin.findIndex((v) => Math.abs(v) < 0.5); return k < 0 ? S.annees.length : k + 1; };

  // Les barres de la cascade : type (total, plus, moins), niveau de départ et d'arrivée, libellé d'axe, groupe
  function barres(S, lecture){
    const d0 = S.debut[0], A = d3.sum(S.accretion), b = [];
    b.push({ type: "total", quoi: "init", court: "Initiale", de: 0, a: d0, groupe: -1 });
    if(lecture === "duree"){
      b.push({ type: "plus", quoi: "acc", court: "Accrétion", de: d0, a: d0 + A, groupe: -1 });
      b.push({ type: "total", quoi: "alib", court: "À libérer", de: 0, a: d0 + A, groupe: -1 });
      let r = d0 + A;
      S.annees.forEach((an, k) => { b.push({ type: "moins", quoi: "lib", k, court: String(an), de: r, a: r - S.liberation[k], groupe: -1 }); r -= S.liberation[k]; });
      b.push({ type: "total", quoi: "fin", court: "Fin", de: 0, a: Math.max(0, r), groupe: -1 });
    } else {
      S.annees.forEach((an, k) => {
        b.push({ type: "plus", quoi: "acc", k, de: S.debut[k], a: S.debut[k] + S.accretion[k], groupe: k });
        b.push({ type: "moins", quoi: "lib", k, de: S.debut[k] + S.accretion[k], a: S.fin[k], groupe: k });
        b.push({ type: "total", quoi: "csm", k, de: 0, a: S.fin[k], groupe: k });
      });
    }
    return b;
  }

  GALERIE.ajouter({
    cle: "csm",
    famille: "IFRS 17",
    titre: "CSM",
    get message(){
      const G = GALERIE, S = DONNEES.csm, n = duree(S);
      return `La CSM initiale de ${G.meur(S.debut[0] / M)}, accrétée de ${G.meur(d3.sum(S.accretion) / M)}, se libère en ${n} ans, de ${G.meur(S.liberation[0] / M, 2)} en ${S.annees[0]} à ${G.meur(S.liberation[n - 1] / M, 2)} en ${S.annees[n - 1]}`;
    },
    lecture: "Sur toute la durée : la CSM initiale, l'accrétion au taux verrouillé, puis la libération de chaque année en résultat, jusqu'à zéro. Année par année : la CSM grandit de son accrétion, puis se libère au prorata des unités de couverture ; la libération baisse parce que le capital assuré en vigueur baisse.",
    get source(){ return DONNEES.csm.source + ", en euros"; },
    fiche: { texte: "Fiche S3, IFRS 17 et la CSM", href: "../bibliotheque/S3/index.html" },
    prompt: "« En D3.js, fais-moi une cascade de la CSM de cette cohorte : la CSM initiale, plus l'accrétion au taux verrouillé, moins la libération de chaque année, jusqu'à zéro. Les sous-totaux en bleu marine, l'accrétion en vert, les libérations en rouge, des connecteurs entre les barres, les montants en M€ sur chaque barre. Deux lectures : sur toute la durée, et année par année avec la CSM de fin d'année. Au survol : le montant, le taux verrouillé ou la part de la CSM libérée. »",
    outils: [{ cle: "lecture", nom: "Lecture", options: [{ v: "duree", nom: "Sur toute la durée" }, { v: "annee", nom: "Année par année" }], defaut: "duree" }],
    dessiner(el, D, etat){
      const G = GALERIE, c = G.couleurs, S = D.csm, n = S.annees.length, an = (k) => S.annees[k];
      const lecture = etat.lecture, b = barres(S, lecture);
      const taux = S.accretion[0] / S.debut[0];
      const m2 = (x) => G.nb(x / M, 2);

      const L = Math.max(360, el.clientWidth), H = 400, m = { h: 26, b: 46, g: 46, d: 8 };
      const svg = G.svg(el, L, H), base = H - m.b;
      const y = d3.scaleLinear().domain([0, d3.max(b, (d) => Math.max(d.de, d.a))]).nice().range([base, m.h]);

      // Abscisses : une place par barre ; année par année, un petit écart entre les années
      const ecartG = lecture === "annee" ? 0.6 : 0;
      let u0 = 0;
      b.forEach((d, i) => { if(i > 0 && d.groupe !== b[i - 1].groupe) u0 += ecartG; d.u = u0; u0 += 1; });
      const u = (L - m.g - m.d) / u0, bw = Math.min(46, u * (lecture === "annee" ? 0.74 : 0.62));
      const cx = (d) => m.g + (d.u + 0.5) * u;

      // Année par année : un fond clair sous les trois barres de chaque année
      if(lecture === "annee") svg.append("g").selectAll("rect").data(S.annees.map((a, k) => k)).join("rect")
        .attr("x", (k) => cx(b[1 + 3 * k]) - u / 2 + 1).attr("width", 3 * u - 2).attr("y", m.h - 6).attr("height", base - m.h + 6)
        .attr("rx", 4).attr("fill", c.sable);
      // Grille et axe des montants
      svg.append("g").attr("class", "grille").attr("transform", `translate(${m.g},0)`)
        .call(d3.axisLeft(y).ticks(6).tickSize(-(L - m.g - m.d)).tickFormat("")).call((g) => g.select(".domain").remove());
      svg.append("g").attr("class", "axe").attr("transform", `translate(${m.g},0)`)
        .call(d3.axisLeft(y).ticks(6).tickFormat((v) => G.nb(v / M, 0)));
      svg.append("text").attr("x", m.g - 6).attr("y", m.h - 12).attr("text-anchor", "end").style("font-size", "11px").text("M€");
      svg.append("line").attr("x1", m.g).attr("x2", L - m.d).attr("y1", base).attr("y2", base).attr("stroke", c.navy);

      // Connecteurs : du niveau atteint par une barre au départ de la suivante
      svg.append("g").selectAll("line").data(b.slice(0, -1)).join("line")

        .attr("y1", (d) => y(d.a)).attr("y2", (d) => y(d.a))
        .attr("stroke", c.steelL).attr("stroke-dasharray", "3,2").attr("stroke-width", 1);

      // Les barres ; un total nul se dessine comme un trait sur l'axe
      const teinte = { total: c.navy, plus: c.teal, moins: c.crimson };
      const gb = svg.append("g").selectAll("g").data(b).join("g");
      gb.append("rect").attr("class", "barre").attr("x", (d) => cx(d) - bw / 2).attr("width", bw)

        .attr("rx", (d) => Math.abs(y(d.de) - y(d.a)) > 6 ? 3 : 0).attr("fill", (d) => teinte[d.type]);
      gb.filter((d) => d.type === "total" && d.a < 0.5).append("rect").attr("x", (d) => cx(d) - bw / 2).attr("width", bw)
        .attr("y", base - 2).attr("height", 3).attr("fill", c.navy);

      // Les montants : au-dessus des totaux et des hausses, sous les baisses ; un montant qui en chevauche un autre s'efface
      const texte = (d) => d.type === "plus" ? "+" + m2(d.a - d.de) : d.type === "moins" ? "−" + m2(d.de - d.a) : (d.a < 0.5 ? "0" : m2(d.a));
      const etiq = gb.append("text").attr("x", cx).attr("text-anchor", "middle").style("font-size", "11px")
        .attr("y", (d) => d.type === "moins" ? y(d.a) + 13 : y(Math.max(d.de, d.a)) - 5)
        .style("fill", (d) => d.type === "total" ? c.navy : "var(--ink-soft)").style("font-weight", (d) => d.type === "total" ? 700 : 500)
        .text(texte);
      const rang = { total: 0, moins: 1, plus: 2 }, gardees = [];
      etiq.nodes().map((nd, i) => ({ nd, d: b[i] })).sort((p, q) => rang[p.d.type] - rang[q.d.type]).forEach(({ nd }) => {
        const r = nd.getBBox(), touche = gardees.some((g) => r.x < g.x + g.width + 2 && g.x < r.x + r.width + 2 && r.y < g.y + g.height && g.y < r.y + r.height);
        if(touche) nd.remove(); else gardees.push(r);

      // Libellés d'abscisse : chaque barre sur toute la durée, l'année sous son groupe année par année
      const xl = lecture === "duree" ? b.map((d) => ({ x: cx(d), t: d.court }))
        : [{ x: cx(b[0]), t: "Initiale" }].concat(S.annees.map((a, k) => ({ x: cx(b[1 + 3 * k + 1]), t: String(a) })));
      svg.append("g").selectAll("text").data(xl).join("text").attr("x", (d) => d.x).attr("y", base + 30).attr("text-anchor", "middle")
        .style("font-size", "11px").style("fill", c.navy).text((d) => d.t);

      // Survol : une cible de toute la hauteur par barre, même quand la barre est fine
      const dire = (d) => {
        const k = d.k;
        if(d.quoi === "init") return `<b>CSM initiale</b><br>${G.meur(d.a / M, 2)} en début de ${an(0)}<br><span class="m">le profit attendu du contrat, pas encore gagné</span>`;
        if(d.quoi === "alib") return `<b>À libérer en résultat</b><br>${G.meur(d.a / M, 2)}<br><span class="m">= CSM initiale ${m2(S.debut[0])} + accrétion ${m2(d3.sum(S.accretion))}</span>`;
        if(d.quoi === "fin") return `<b>CSM finale</b><br>0 M€ en fin de ${an(n - 1)} : tout est libéré`;
        if(d.quoi === "acc" && k === undefined) return `<b>Accrétion, ${an(0)} à ${an(n - 1)}</b><br>+${G.meur((d.a - d.de) / M, 2)}<br><span class="m">les intérêts de la CSM au taux verrouillé de ${G.pct(taux)}</span>`;
        if(d.quoi === "acc") return `<b>Accrétion ${an(k)}</b><br>+${G.meur(S.accretion[k] / M, 2)}<br><span class="m">= ${G.pct(S.accretion[k] / S.debut[k])} × ${m2(S.debut[k])}, au taux verrouillé</span>`;
        if(d.quoi === "lib") return `<b>Libération ${an(k)}</b><br>−${G.meur(S.liberation[k] / M, 2)}, reconnus en résultat` +
          `<br><span class="m">${G.pct(S.liberation[k] / (S.debut[k] + S.accretion[k]))} de la CSM accrétée de l'année, au prorata des unités de couverture</span>` +
          (lecture === "duree" ? `<br>Reste à libérer ${G.meur(d.a / M, 2)}` : "");
        return `<b>CSM fin ${an(k)}</b><br>${G.meur(S.fin[k] / M, 2)}<br><span class="m">= ${m2(S.debut[k])} + ${m2(S.accretion[k])} − ${m2(S.liberation[k])}</span>`;
      };
      gb.append("rect").attr("x", (d) => cx(d) - u / 2).attr("width", u).attr("y", m.h).attr("height", base - m.h).attr("fill", "transparent")
        .on("mousemove", function(ev, d){
          gb.select("rect.barre").attr("stroke", (e) => e === d ? c.navy : null).attr("stroke-width", 2).attr("opacity", (e) => e === d ? 1 : 0.55);
          G.bulle(ev, dire(d));
        })
        .on("mouseleave", () => { gb.select("rect.barre").attr("stroke", null).attr("opacity", 1); G.cacher(); });

      // Légende
      d3.select(el).append("div").attr("class", "legende").html(
        `<span><i style="background:${c.navy}"></i>CSM : initiale, sous-totaux, fin</span>` +
        `<span><i style="background:${c.teal}"></i>Accrétion au taux verrouillé (${G.pct(taux)})</span>` +
        `<span><i style="background:${c.crimson}"></i>Libération en résultat</span>`);
    },
  });
})();
/* Le diagramme de Lexis de la table prospective de la fiche V2 : l'âge en hauteur, l'année en largeur, q_x en
   couleur logarithmique ; une génération (année moins âge) suit une diagonale, que la fiche V3 lit pour un

(function(){
  "use strict";

    },

    prompt: "« En D3.js, trace cette table de mortalité prospective en diagramme de Lexis : l'âge en hauteur, l'année en largeur, chaque case colorée selon q_x en échelle logarithmique, avec la légende de l'échelle. Au survol d'une case, surligne sa génération (année moins âge) sur toute sa diagonale, et donne q_x, l'âge, l'année et la génération. À côté, compare pour la génération 1966 la lecture en diagonale et la colonne de 2026. »",
    outils: [{ cle: "gen", nom: "Génération", options: [{ v: "1946", nom: "1946" }, { v: "1966", nom: "1966, fiche V3" }, { v: "1986", nom: "1986" }], defaut: "1966" }],
    dessiner(el, D, etat){

      const diag = (g) => d3.range(Math.max(a0, y0 - g), Math.min(aN, yN - g) + 1).map((a) => ({ a, y: g + a, q: q(a, g + a) }));

      // Géométrie : la carte à gauche, le panneau de comparaison à droite quand la largeur le permet

      const m = { g: 46, h: 24 }, ph = 350, hx0 = m.g, hx1 = L - pw - ecart, hy0 = m.h, hy1 = m.h + ph, H = hy1 + 68;

      svg.append("rect").attr("x", hx0).attr("y", hy0).attr("width", hx1 - hx0).attr("height", hy1 - hy0).attr("fill", "none").attr("stroke", c.ligne);

      svg.append("text").attr("x", hx0 - 8).attr("y", hy0 - 10).attr("text-anchor", "end").style("font-size", "11px").text("Âge");

      // Les lignes d'égal q_x : l'âge où q_x atteint 1 %, puis 10 %, monte d'une année à l'autre

      const bout = dg[dg.length - 1], xb = cx(bout.y), yb = bout.a === aN ? hy0 - 6 : cy(bout.a);
      const tb = svg.append("text").attr("y", yb).style("font-size", "11px").style("fill", c.navy).style("font-weight", 600).text(`génération ${gen}`);
      const lb = tb.node().getComputedTextLength();
      tb.attr("x", Math.min(hx1 - lb, Math.max(hx0, xb - lb / 2)));

      // Légende de l'échelle logarithmique
      const lg = svg.append("g").attr("transform", `translate(${hx0},${hy1 + 40})`), bw = Math.min(200, (hx1 - hx0) * 0.42);
      const t1 = lg.append("text").attr("y", 5).attr("dy", "0.35em").style("font-size", "11px").text("qₓ, échelle logarithmique");
      let xl = t1.node().getComputedTextLength() + 10;
      const t2 = lg.append("text").attr("x", xl).attr("y", 5).attr("dy", "0.35em").style("font-size", "11px").text(pq(qmin));
      xl += t2.node().getComputedTextLength() + 6;
      const grad = svg.append("defs").append("linearGradient").attr("id", "lexis-degrade");

      [0.001, 0.01, 0.1].forEach((v) => {

    },

/* Le portefeuille auto des fiches de tarification : un sunburst zoomable, région, puis tranche d'âge, puis classe de
   bonus-malus. L'angle est la part des primes (ou des polices), la couleur le S/P, sur une échelle divergente centrée sur
   le S/P du portefeuille. À droite : la légende, et les enfants du niveau ouvert classés par S/P, avec leur nombre de
   sinistres (un petit segment a un S/P très bruité). Données : D.portefeuille.lignes (_extraire.py). */
(function(){
  "use strict";
  const G = GALERIE;
  const PEU = 30;                                        // sous ce nombre de sinistres, le S/P d'un segment est très instable
  const LISTE = ["Par région", "Par tranche d'âge", "Par classe de bonus-malus"];
  const CHAMPS = ["primes", "sinistres", "nb", "exposition", "polices"];
  const cumul = (xs) => Object.fromEntries(CHAMPS.map((c) => [c, d3.sum(xs, (x) => x[c])]));
  const sp = (s) => (s.primes > 0 ? s.sinistres / s.primes : 0);
  const eur = (x) => (x >= 1e6 ? G.meur(x / 1e6, 2) : G.nb(x / 1e3, 0) + " k€");
  const pluriel = (k, mot) => `${G.nb(k)} ${mot}${k > 1 ? "s" : ""}`;

  // Mesure du texte, pour n'écrire un libellé que là où il tient
  const ctx = document.createElement("canvas").getContext("2d");
  const largeurs = new Map();
  const mesure = (t, police) => {
    const k = police + "|" + t;
    if(!largeurs.has(k)){ ctx.font = police; largeurs.set(k, ctx.measureText(t).width); }
    return largeurs.get(k);
  };
  const POLICE = "600 11px Inter, 'Segoe UI', system-ui, sans-serif";

  // Les variantes d'un libellé, de la plus complète à la plus courte
  function sigle(nom){
    const mots = nom.normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[-\s]+/).map((w) => w.replace(/^d'/, ""));
    return mots.length === 1 ? nom.slice(0, 4) + "." : mots.map((w) => w[0].toUpperCase()).join("");
  }
  function coupe2(nom){                                   // la coupure en deux lignes la plus équilibrée, après un tiret ou à un espace
    let mieux = null;
    for(let i = 1; i < nom.length - 1; i++){
      const c = nom[i];
      if(c !== "-" && c !== " ") continue;
      const a = c === "-" ? nom.slice(0, i + 1) : nom.slice(0, i), b = nom.slice(i + 1);
      const w = Math.max(mesure(a, POLICE), mesure(b, POLICE));
      if(!mieux || w < mieux.w) mieux = { w, l: [a, b] };
    }
    return mieux && mieux.l;
  }
  function variantes(d){
    const nom = d.data.nom, v = [[nom]];
    if(d.depth === 1){ const c = coupe2(nom); if(c) v.push(c); v.push([sigle(nom)]); }
    const court = nom.replace(/ ans/g, "").replace(/ et plus$/, " et +");
    if(court !== nom) v.push([court]);
    return v;
  }

  G.ajouter({
    cle: "portefeuille",
    famille: "Tarification",
    titre: "Portefeuille",
    get message(){
      const L = DONNEES.portefeuille.lignes;
      const reg = d3.rollups(L, (v) => sp(cumul(v)), (l) => l.region).sort((a, b) => b[1] - a[1])[0];
      return `Le portefeuille a un S/P de ${G.pct(sp(cumul(L)))} ; la région au S/P le plus haut, ${reg[0]}, est à ${G.pct(reg[1])}`;
    },
    lecture: "L'angle d'un arc est sa part des primes (ou des polices), sa couleur son S/P : bleu sous le S/P du portefeuille, rouge au-dessus. Cliquez sur un arc pour zoomer, au centre pour remonter ; sur un petit segment, regardez le nombre de sinistres avant de croire le S/P.",
    get source(){
      const s = DONNEES.portefeuille.source;
      return s.charAt(0).toLowerCase() + s.slice(1) + ", agrégées par région, tranche d'âge et classe de bonus-malus";
    },
    fiche: { texte: "Fiche C1, le tableau de bord de sinistralité", href: "../bibliotheque/C1/index.html" },
    prompt: "« En D3.js, fais-moi un sunburst zoomable de ce portefeuille auto : la région au centre, puis la tranche d'âge, puis la classe de bonus-malus. L'angle de chaque arc est proportionnel aux primes acquises, avec un bouton pour passer au nombre de polices ; la couleur est le S/P (sinistres ÷ primes), sur une échelle divergente centrée sur le S/P du portefeuille, bleu en dessous, rouge au-dessus, avec sa légende. Un clic sur un arc zoome dessus, un clic au centre remonte. Écris les libellés là où ils tiennent ; au survol, affiche les primes, les sinistres, le S/P, les polices, le nombre de sinistres et la fréquence. »",
    outils: [{ cle: "taille", nom: "Angle", options: [{ v: "primes", nom: "Primes" }, { v: "polices", nom: "Polices" }], defaut: "primes" }],
    dessiner(el, D, etat){
      const C = G.couleurs;
      // L'arbre : région, tranche d'âge, classe de bonus-malus ; les sommes à chaque nœud
      const g = d3.group(D.portefeuille.lignes, (l) => l.region, (l) => l.age, (l) => l.bonus_malus);
      const noeud = (nom, v) => (v instanceof Map ? { nom, children: Array.from(v, ([k, w]) => noeud(k, w)) } : Object.assign({ nom }, cumul(v)));
      const root = d3.hierarchy(noeud("Portefeuille", g));
      root.eachAfter((d) => { d.s = d.children ? cumul(d.children.map((c) => c.s)) : cumul([d.data]); });
      root.sum((d) => (d.children ? 0 : d[etat.taille]));
      // Les régions de la plus grosse à la plus petite (en primes, pour qu'elles ne bougent pas d'un angle à l'autre) ;
      // les tranches d'âge et les classes dans leur ordre naturel
      root.sort((a, b) => (a.depth === 1 ? b.s.primes - a.s.primes : parseFloat(a.data.nom) - parseFloat(b.data.nom)));
      d3.partition().size([2 * Math.PI, root.height + 1])(root);

      // La couleur : le S/P rapporté à celui du portefeuille, de moitié (acier) au double (crimson), gris au centre
      const sp0 = sp(root.s);
      const versBas = d3.interpolateLab(C.steel, C.ligne), versHaut = d3.interpolateLab(C.ligne, C.crimson);
      const pos = (v) => Math.max(-1, Math.min(1, Math.log2(Math.max(v, 1e-9) / sp0)));
      const couleur = (v) => { const t = pos(v); return t < 0 ? versBas(1 + t) : versHaut(t); };
      const encre = (fond) => (d3.lab(fond).l < 58 ? "#fff" : C.navy);

      // La mise en page : le sunburst à gauche, le panneau (légende et liste) à droite ; en dessous s'il manque la place
      const L = Math.max(320, el.clientWidth), PAN = 330, ECART = 34;
      const cote = L >= 2 * 160 + ECART + PAN;
      const HP = 74 + 26 + 22 * 6 + 22;                    // hauteur du panneau : légende, titre, lignes, note
      let R, H, cx, cy, px, py;
      if(cote){
        H = 440; R = Math.min(H / 2 - 6, (L - ECART - PAN - 8) / 2);
        const ox = Math.max(0, (L - (2 * R + ECART + PAN)) / 2);
        cx = ox + R; cy = H / 2; px = ox + 2 * R + ECART; py = Math.max(8, cy - HP / 2 - 10);
      } else {
        R = Math.min((L - 16) / 2, (460 - 24 - HP) / 2); H = 2 * R + 24 + HP;
        cx = L / 2; cy = R + 6; px = Math.max(0, (L - PAN) / 2); py = 2 * R + 24;
      }
      const R0 = (h) => R * ({ 3: 0.25, 2: 0.32, 1: 0.42 }[h] || 0.3);

      // Le fil, au-dessus : où l'on est, et de quoi remonter
      const fil = d3.select(el).append("p").attr("class", "fil").style("min-height", "18px");
      const svg = G.svg(el, L, H);
      const centre = svg.append("g").attr("transform", `translate(${cx},${cy})`);
      const arc = d3.arc().startAngle((d) => d.x0).endAngle((d) => d.x1)
        .padAngle((d) => Math.min((d.x1 - d.x0) / 2, 0.005)).padRadius(R / 2)
        .innerRadius((d) => d.y0).outerRadius((d) => Math.max(d.y0, d.y1 - 1.5));
      const visible = (t) => t.y1 - t.y0 > 0.5 && t.x1 - t.x0 > 1e-6;

      let focus = root;
      (etat.focus || []).forEach((nom) => { const c = (focus.children || []).find((x) => x.data.nom === nom); if(c) focus = c; });
      function cibles(p){
        const r0 = R0(p.height), u = (R - r0) / p.height, w = p.x1 - p.x0;
        root.each((d) => {
          const rel = d.depth - p.depth;
          d.target = { x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / w)) * 2 * Math.PI, x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / w)) * 2 * Math.PI,
            y0: rel >= 1 ? r0 + (rel - 1) * u : r0, y1: rel >= 1 ? r0 + rel * u : r0 };
        });
        return r0;
      }
      let r0 = cibles(focus);
      root.each((d) => { d.current = d.target; });

      // L'infobulle d'un nœud
      const bulle = (ev, d) => {
        const v = sp(d.s), parents = d.ancestors().reverse().slice(1, -1).map((a) => a.data.nom).join(" › ");
        const ligne = (k, x) => `<tr><td class="m" style="padding-right:14px">${k}</td><td style="text-align:right">${x}</td></tr>`;
        G.bulle(ev, `<b>${d.data.nom}</b>${parents ? ` <span class="m">${parents}</span>` : ""}` +
          `<table style="border-collapse:collapse;margin-top:3px">` +
          ligne("Primes", G.nb(d.s.primes) + " €") + ligne("Sinistres", G.nb(d.s.sinistres) + " €") +
          ligne("S/P", `<b style="color:${pos(v) > 0.15 ? C.crimson : C.navy}">${G.pct(v)}</b>`) +
          ligne("Polices", G.nb(d.s.polices)) + ligne("Nombre de sinistres", G.nb(d.s.nb)) +
          ligne("Fréquence", G.pct(d.s.exposition > 0 ? d.s.nb / d.s.exposition : 0) + " par an") + `</table>` +
          `<span class="m">${G.pct(d.s.primes / root.s.primes)} des primes, ${G.pct(d.s.polices / root.s.polices)} des polices</span>` +
          (d.s.nb < PEU ? `<br><span style="color:${C.crimson}">${d.s.nb ? "Seulement " + pluriel(d.s.nb, "sinistre") : "Aucun sinistre"} : ce S/P est très instable.</span>` : ""));
      };
      const surligner = (d, oui) => { if(d.el) d3.select(d.el).attr("stroke", oui ? C.navy : null).attr("stroke-width", oui ? 1.6 : null); };

      // Les arcs
      const noeuds = root.descendants().slice(1);
      const chemins = svg.append("g").attr("transform", `translate(${cx},${cy})`).selectAll("path").data(noeuds).join("path")
        .each(function(d){ d.el = this; })
        .attr("fill", (d) => couleur(sp(d.s))).attr("d", (d) => arc(d.current))
        .attr("fill-opacity", (d) => (visible(d.current) && d.depth > focus.depth ? 1 : 0))
        .attr("pointer-events", (d) => (visible(d.current) && d.depth > focus.depth ? "auto" : "none"))
        .style("cursor", (d) => (d.children ? "pointer" : "default"))
        .on("pointermove", (ev, d) => bulle(ev, d))
        .on("pointerenter", (ev, d) => surligner(d, true))
        .on("pointerleave", (ev, d) => { surligner(d, false); G.cacher(); })
        .on("click", (ev, d) => { if(d.children) zoomer(d, true); });
      const libelles = svg.append("g").attr("transform", `translate(${cx},${cy})`).attr("pointer-events", "none")
        .style("font", POLICE).style("font-size", "11px");

      function placer(d){
        const t = d.target;
        if(d.depth <= focus.depth || !visible(t)) return null;
        const a = t.x1 - t.x0, th = t.y1 - t.y0, rm = (t.y0 + t.y1) / 2, LH = 13;
        const tangentiel = (l) => { const w = d3.max(l, (x) => mesure(x, POLICE)), h = l.length * LH; return h <= th - 6 && w <= a * (rm - h / 2) - 8; };
        const radial = (l) => { const w = mesure(l[0], POLICE); return l.length === 1 && w <= th - 10 && a * (rm - w / 2) >= LH; };
        // Le sens le plus proche de l'horizontale d'abord : le long de l'arc en haut et en bas, selon le rayon sur les côtés
        const ang = (t.x0 + t.x1) / 2 * 180 / Math.PI, rad = ang * Math.PI / 180;
        const essais = Math.abs(Math.cos(rad)) >= Math.abs(Math.sin(rad)) ? [["t", tangentiel], ["r", radial]] : [["r", radial], ["t", tangentiel]];
        for(const l of variantes(d)){
          for(const [mode, ok] of essais) if(ok(l)){
            const tour = mode === "t" ? (ang > 90 && ang < 270 ? -90 : 90) : (ang < 180 ? 0 : 180);
            return { d, l, transform: `rotate(${ang - 90}) translate(${rm},0) rotate(${tour})` };
          }
        }
        return null;
      }
      function poserLibelles(anime){
        const places = noeuds.map(placer).filter(Boolean);
        const tx = libelles.selectAll("text").data(places, (p) => p.d.ancestors().map((a) => a.data.nom).join("|"))
          .join("text").attr("transform", (p) => p.transform).attr("text-anchor", "middle")
          .style("fill", (p) => encre(couleur(sp(p.d.s))));
        tx.selectAll("tspan").data((p) => p.l.map((x, i) => ({ x, i, n: p.l.length }))).join("tspan")
          .attr("x", 0).attr("dy", (s) => (s.i === 0 ? `${0.35 - (s.n - 1) * 0.6}em` : "1.2em")).text((s) => s.x);
        if(anime) tx.attr("opacity", 0).transition().duration(250).attr("opacity", 1);
        else tx.attr("opacity", 1);
      }

      // Le centre : le nœud ouvert, son S/P ; un clic remonte
      const disque = centre.append("circle").attr("r", r0).attr("fill", "#fff")
        .on("click", () => { if(focus.parent) zoomer(focus.parent, true); });
      const texteCentre = centre.append("text").attr("text-anchor", "middle").attr("pointer-events", "none");
      function poserCentre(){
        disque.style("cursor", focus.parent ? "pointer" : "default");
        const lignes = [], larg = 2 * r0 * 0.86, policeNom = "700 12.5px Inter, 'Segoe UI', system-ui, sans-serif";
        if(larg < 80){                                       // petit disque (écran étroit) : le S/P seul
          texteCentre.selectAll("tspan").data([G.pct(sp(focus.s))]).join("tspan").attr("x", 0).attr("dy", "0.35em")
            .style("font-size", "11px").style("font-weight", 700).style("fill", C.navy).text((x) => x);
          return;
        }
        if(focus.depth === 2) lignes.push({ t: focus.parent.data.nom, s: "11px", g: 400, c: C.steel });
        const nom = focus.data.nom;
        (mesure(nom, policeNom) <= larg ? [nom] : (coupe2(nom) || [nom])).forEach((t) => lignes.push({ t, s: "12.5px", g: 700, c: C.navy }));
        lignes.push({ t: "S/P " + G.pct(sp(focus.s)), s: "15px", g: 700, c: pos(sp(focus.s)) > 0.15 ? C.crimson : C.navy, h: 1.45 });
        lignes.push({ t: etat.taille === "primes" ? "primes " + eur(focus.s.primes) : pluriel(focus.s.polices, "police"), s: "11px", g: 400, c: "#78828f" });
        const hauteur = d3.sum(lignes, (x, i) => (i ? (x.h || 1.25) * parseFloat(x.s) : 0));
        texteCentre.selectAll("tspan").data(lignes).join("tspan").attr("x", 0)
          .attr("dy", (x, i) => (i ? (x.h || 1.25) * parseFloat(x.s) : -hauteur / 2 + 4) + "px")
          .style("font-size", (x) => x.s).style("font-weight", (x) => x.g).style("fill", (x) => x.c).text((x) => x.t);
      }

      // Le panneau : la légende, puis les enfants du nœud ouvert classés par S/P
      const pan = svg.append("g").attr("transform", `translate(${px},${py})`);
      const LB = 250;
      const deg = svg.append("defs").append("linearGradient").attr("id", "portefeuille-sp");
      d3.range(0, 1.0001, 0.1).forEach((k) => deg.append("stop").attr("offset", k).attr("stop-color", couleur(sp0 * Math.pow(2, 2 * k - 1))));
      pan.append("text").attr("y", 10).style("font-size", "12px").style("font-weight", 700).style("fill", C.navy).text("S/P, sinistres ÷ primes");
      pan.append("rect").attr("y", 20).attr("width", LB).attr("height", 10).attr("rx", 2).attr("fill", "url(#portefeuille-sp)");
      pan.append("line").attr("x1", LB / 2).attr("x2", LB / 2).attr("y1", 17).attr("y2", 33).attr("stroke", C.navy).attr("stroke-width", 1.5);
      [[0, "start", "≤ " + G.pct(sp0 / 2, 0)], [LB / 2, "middle", "portefeuille " + G.pct(sp0)], [LB, "end", "≥ " + G.pct(2 * sp0, 0)]]
        .forEach(([x, ancre, t]) => pan.append("text").attr("x", x).attr("y", 46).attr("text-anchor", ancre).style("font-size", "11px").text(t));
      const marque = pan.append("path").attr("d", "M0,0l-5,-7h10z").attr("fill", C.navy);
      const liste = pan.append("g").attr("transform", "translate(0,74)");
      const COL_SP = 262, COL_NB = PAN - 2;
      function poserPanneau(){
        marque.attr("transform", `translate(${(pos(sp(focus.s)) + 1) / 2 * LB},19)`).style("display", focus.parent ? null : "none");
        liste.selectAll("*").remove();
        liste.append("text").style("font-size", "12px").style("font-weight", 700).style("fill", C.navy).text(LISTE[focus.depth]);
        liste.append("text").attr("x", COL_SP).attr("text-anchor", "end").style("font-size", "11px").style("fill", "#78828f").text("S/P");
        liste.append("text").attr("x", COL_NB).attr("text-anchor", "end").style("font-size", "11px").style("fill", "#78828f").text("sinistres");
        const enfants = (focus.children || []).slice().sort((a, b) => sp(b.s) - sp(a.s));
        const rangs = liste.selectAll("g.rang").data(enfants).join("g").attr("class", "rang")
          .attr("transform", (d, i) => `translate(0,${22 + i * 22})`).style("cursor", (d) => (d.children ? "pointer" : "default"))
          .on("pointermove", (ev, d) => bulle(ev, d)).on("pointerenter", (ev, d) => surligner(d, true))
          .on("pointerleave", (ev, d) => { surligner(d, false); G.cacher(); })
          .on("click", (ev, d) => { if(d.children){ G.cacher(); zoomer(d, true); } });
        rangs.append("rect").attr("x", -4).attr("y", -15).attr("width", PAN + 6).attr("height", 21).attr("fill", "transparent");
        rangs.append("rect").attr("y", -10).attr("width", 11).attr("height", 11).attr("rx", 2).attr("fill", (d) => couleur(sp(d.s)));
        rangs.append("text").attr("x", 18).style("font-size", "12px").style("fill", "#1f2733").text((d) => d.data.nom);
        rangs.append("text").attr("x", COL_SP).attr("text-anchor", "end").style("font-size", "12px").style("font-weight", 600)
          .style("fill", (d) => (pos(sp(d.s)) > 0.15 ? C.crimson : C.navy)).text((d) => G.pct(sp(d.s)));
        rangs.append("text").attr("x", COL_NB).attr("text-anchor", "end").style("font-size", "12px")
          .style("fill", (d) => (d.s.nb < PEU ? C.crimson : "#78828f")).text((d) => G.nb(d.s.nb));
        if(enfants.some((d) => d.s.nb < PEU))
          liste.append("text").attr("y", 22 + enfants.length * 22 + 4).style("font-size", "11px").style("fill", "#78828f")
            .text(`en rouge : moins de ${PEU} sinistres, S/P peu fiable`);
      }
      function poserFil(){
        fil.selectAll("*").remove();
        focus.ancestors().reverse().forEach((a, i, tous) => {
          if(i) fil.append("span").text(" › ");
          if(a === focus) fil.append("b").style("color", C.navy).text(a.data.nom);
          else fil.append("a").text(a.data.nom).on("click", () => zoomer(a, true));
        });
        const ouvrir = focus.children && focus.children[0].children;
        fil.append("span").style("margin-left", "10px").text(ouvrir && focus.parent ? "(cliquez sur un arc pour l'ouvrir, au centre pour remonter)"
          : ouvrir ? "(cliquez sur un arc pour l'ouvrir)" : "(cliquez au centre pour remonter)");
      }

      function zoomer(p, anime){
        focus = p;
        etat.focus = p.ancestors().reverse().slice(1).map((a) => a.data.nom);
        r0 = cibles(p);
        libelles.selectAll("text").interrupt().attr("opacity", 0);
        const tr = svg.transition().duration(anime ? 650 : 0).ease(d3.easeCubicInOut);
        chemins.transition(tr)
          .tween("data", (d) => { const i = d3.interpolate(d.current, d.target); return (k) => { d.current = i(k); }; })
          .attr("fill-opacity", (d) => (visible(d.target) && d.depth > p.depth ? 1 : 0))
          .attr("pointer-events", (d) => (visible(d.target) && d.depth > p.depth ? "auto" : "none"))
          .attrTween("d", (d) => () => arc(d.current));
        disque.transition(tr).attr("r", r0);
        tr.end().then(() => poserLibelles(true)).catch(() => {});
        poserCentre(); poserPanneau(); poserFil();
      }
      poserLibelles(false); poserCentre(); poserPanneau(); poserFil();
    },
  });
})();
GALERIE.demarrer();
</script>
</body>
