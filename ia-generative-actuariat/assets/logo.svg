<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IA générative pour l'actuariat">
  <!-- La marque du site : le triangle de liquidation, que tout actuaire
       reconnait, et l'etincelle a la place du coin manquant, celui qu'on
       estime. Blanc sur navy de la charte, etincelle crimson. Six cases
       seulement et une grande etincelle : la marque doit encore se lire a
       16 px, la taille d'une favicon dans un onglet. Sert de favicon
       (favicon.svg, favicon.png, apple-touch-icon.png, poses par
       outils/make_favicon.py). -->
  <rect width="64" height="64" rx="15" fill="#13264A"/>
  <g fill="#ffffff">
    <rect x="12" y="14" width="12" height="10" rx="3" opacity=".95"/>
    <rect x="27" y="14" width="12" height="10" rx="3" opacity=".95"/>
    <rect x="42" y="14" width="12" height="10" rx="3" opacity=".95"/>
    <rect x="12" y="27" width="12" height="10" rx="3" opacity=".78"/>
    <rect x="27" y="27" width="12" height="10" rx="3" opacity=".78"/>
    <rect x="12" y="40" width="12" height="10" rx="3" opacity=".6"/>
  </g>
  <path d="M44 31 Q46 42 57 44 Q46 46 44 57 Q42 46 31 44 Q42 42 44 31 Z" fill="#e8536e"/>
</svg>
