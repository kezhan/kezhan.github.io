<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Académia</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B1E5C">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css?v=0cbc4d98">
<link rel="stylesheet" href="style_combat.css?v=0cbc4d98">
<link rel="stylesheet" href="style_scenes.css?v=0cbc4d98">
<script>
/* Before everything. Opened as a file (a double click on index.html), the game cannot read its pictures and
   questions; a script that did not come (the network cut during the first visit) stops it. In both cases a clear
   screen instead of an empty game: js/demarrage.js does not start, or this screen comes when its start fails. */
(() => {
  const manquants = window.__scriptsManquants = [];
  addEventListener("error", e => { if (e.target && e.target.tagName === "SCRIPT") manquants.push(e.target.src); }, true);
  window.ecranSecours = (titre, texte, bouton) => {
    if (document.getElementById("secours")) return;
    const d = document.createElement("div"), h = document.createElement("h1"), p = document.createElement("p");
    d.id = "secours";
    d.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;"
      + "gap:20px;padding:24px;background:#2B1E5C;color:#FFF;font:600 20px/1.45 Nunito,system-ui,sans-serif;text-align:center";
    h.style.cssText = "margin:0;font:700 30px/1.2 Fredoka,system-ui,sans-serif"; p.style.margin = "0";
    h.textContent = titre; p.textContent = texte; d.append(h, p);
    if (bouton) {
      const b = document.createElement(bouton.lien ? "a" : "button");
      b.style.cssText = "min-height:64px;padding:12px 28px;border:0;border-radius:20px;background:#FFD45C;color:#2B1E5C;"
        + "font:700 24px Fredoka,system-ui,sans-serif;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer";
      b.textContent = bouton.texte;
      if (bouton.lien) b.href = bouton.lien; else b.onclick = bouton.action;
      d.append(b);
    }
    (document.body || document.documentElement).append(d);
  };
  window.ecranIncomplet = () => ecranSecours("Le jeu n'est pas arrivé en entier", "Le réseau a coupé pendant le chargement.",
    {texte: "↻ Recharger", action: () => location.reload()});
  document.addEventListener("DOMContentLoaded", () => {
    if (location.protocol === "file:") return ecranSecours("Académia s'ouvre dans le navigateur, pas comme un fichier",
      "Un double clic sur index.html ne peut pas marcher : le navigateur refuse au jeu ses dessins et ses questions. "
      + "En ligne : kezhan.github.io/academia. Sur ce PC, la version du dossier : python jouer_en_local.py, dans le dossier du jeu.",
      {texte: "Ouvrir Académia", lien: "https://kezhan.github.io/academia/"});
    if (manquants.length || typeof demarrer !== "function") ecranIncomplet();
  });
})();
</script>
</head>
<body>
<!-- the game world (Phaser) fills the screen; menus sit on top of it -->
<div id="jeu"></div>

<header class="barre" id="barre" hidden>
  <div class="gardien"><img id="gPortrait" alt=""><span id="gNom"></span><span class="pastille"><img class="icone" data-icone="etincelle" alt=""> <b id="gEtincelles">0</b></span></div>
  <button class="rond" id="btnEquipe" aria-label="Mon équipe"><img class="icone" data-icone="sac" alt=""></button>
</header>

<!-- PROFILES: the village drawn behind (js/jeu/vitrine.js), the starters in front -->
<main id="accueil" class="ecran plein">
  <h1 class="logo" aria-label="Académia">
    <svg viewBox="0 0 560 170" aria-hidden="true">
      <defs>
        <linearGradient id="logoOr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4B0"/><stop offset=".5" stop-color="#FFD45C"/><stop offset="1" stop-color="#F7A531"/></linearGradient>
        <path id="logoEclat" d="M0,-20 Q3,-3 20,0 Q3,3 0,20 Q-3,3 -20,0 Q-3,-3 0,-20 Z"/>
      </defs>
      <text x="280" y="128" text-anchor="middle" class="logo-ombre">Académia</text>
      <text x="280" y="120" text-anchor="middle" class="logo-trait">Académia</text>
      <text x="280" y="120" text-anchor="middle" class="logo-texte">Académia</text>
      <use href="#logoEclat" class="logo-eclat" transform="translate(497 34) scale(1.1)"/>
      <use href="#logoEclat" class="logo-eclat e2" transform="translate(58 46) scale(.6)"/>
      <use href="#logoEclat" class="logo-eclat e3" transform="translate(530 108) scale(.45)"/>
    </svg>
  </h1>
  <p class="sous">Le monde où l'on apprend en s'amusant</p>
  <div class="profils" id="profils"></div>
  <button class="gros palpite" id="btnNouveau" disabled><img class="icone" data-icone="etincelle" alt=""> Nouveau Gardien</button>
  <div class="decor-accueil" id="decorAccueil" aria-hidden="true"></div>
  <p class="version" id="version"></p>
</main>

<!-- NEW GUARDIAN: name, age, hero -->
<section id="creation" class="ecran plein" hidden>
  <h2 class="titre2">Qui es-tu, Gardien ?</h2>
  <div class="carte">
    <label class="etiquette" for="nomGardien">Ton prénom</label>
    <input class="nom" id="nomGardien" maxlength="16" autocomplete="off" enterkeyhint="done" placeholder="Prénom">
    <label class="etiquette">Ton âge</label>
    <div class="ages" id="ages"></div>
    <label class="etiquette">Ton héros</label>
    <div class="heros" id="heros"></div>
  </div>
  <div class="ligne"><button class="moyen gris" data-retour aria-label="Retour"><img class="icone" data-icone="retour" alt=""></button><button class="gros attente" id="btnCreer">C'est parti !</button></div>
</section>

<!-- FIRST COMPANION -->
<section id="choix" class="ecran plein" hidden>
  <h2 class="titre2">Choisis ton premier compagnon</h2>
  <p class="sous" id="choixSous"></p>
  <div class="starters" id="starters"></div>
</section>

<!-- BATTLE: the scene is drawn by Phaser; life boxes, messages, questions and attacks on top -->
<section id="combat" class="ecran" hidden>
  <div class="etat lui" id="etatLui"><b></b><span class="niv"></span><div class="pv"><i></i></div></div>
  <div class="etat moi" id="etatMoi"><b></b><span class="niv"></span><div class="pv"><i></i></div><small class="pvtxt"></small></div>
  <div class="bulle" id="bulleCombat" hidden></div>
  <div class="panneau cache" id="panneau"></div>
</section>

<!-- END OF A FIGHT -->
<section id="fin" class="ecran voile" hidden>
  <div class="carte fin" id="finCarte"></div>
</section>

<!-- TEAM: the child's bag (js/equipe.js); the grown-ups' corner opens from it by a long press -->
<section id="equipe" class="ecran voile" hidden>
  <div class="carte large sac">
    <div class="entete"><h2 class="titre3"><img class="icone" data-icone="sac" alt=""> Mon équipe</h2><button class="rond fermer" id="btnFermerEquipe" aria-label="Fermer"><img class="icone" data-icone="croix" alt=""></button></div>
    <div class="liste-equipe" id="listeEquipe"></div>
    <div class="fiche-seule" id="ficheEquipe" hidden></div>
    <div class="pied-sac"><button class="parents" id="btnParents" aria-label="Coin des parents : garder le doigt appuyé trois secondes"><i class="anneau-appui"></i><img class="icone" data-icone="parents" alt=""> Parents</button><small>appui long</small></div>
  </div>
</section>

<!-- GROWN-UPS' CORNER (js/parents.js) -->
<section id="parents" class="ecran voile" hidden>
  <div class="carte large coin-parents">
    <div class="entete"><h2 class="titre3" id="parentsTitre"><img class="icone" data-icone="parents" alt=""> Parents</h2><button class="joker" id="btnChanger"><img class="icone" data-icone="gardien" alt=""> Changer de Gardien</button><button class="rond fermer" id="btnFermerParents" aria-label="Fermer"><img class="icone" data-icone="croix" alt=""></button></div>
    <nav class="onglets" id="ongletsParents" role="tablist">
      <button role="tab" data-onglet="matieres" aria-selected="true">Matières</button><button role="tab" data-onglet="erreurs">Erreurs</button><button role="tab" data-onglet="temps">Temps</button><button role="tab" data-onglet="reglages">Réglages</button>
    </nav>
    <div class="vue-parents" id="vueParents"></div>
  </div>
</section>

<!-- DIALOGUE WITH A VILLAGER (js/dialogue.js) -->
<div class="dialogue" id="dialogue" hidden>
  <div class="dlg-portrait" id="dlgPortrait"></div>
  <div class="dlg-corps"><b id="dlgNom"></b><p id="dlgTexte"></p><div class="dlg-choix" id="dlgChoix"></div></div>
</div>

<div class="toast" id="toast" hidden></div>
